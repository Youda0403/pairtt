<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pairframe — 페어 다이너 메뉴판 메이커</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

<div class="stage">
  <div class="stage-inner">

<svg id="poster" viewBox="0 0 1000 1500" preserveAspectRatio="xMidYMid meet" role="img" aria-label="페어 메뉴판 미리보기">

  <defs>
    <style id="theme-style"></style>

    <g id="ic-heart"><path d="M0 6.6C-1.4 5.4-7.6 1-7.6-2.8-7.6-5.9-5.1-7.7-2.8-7.7-1.2-7.7-.3-6.8 0-5.9 .3-6.8 1.2-7.7 2.8-7.7 5.1-7.7 7.6-5.9 7.6-2.8 7.6 1 1.4 5.4 0 6.6Z"/></g>
    <g id="ic-star"><path d="M0-10 2.9-3.4 10-2.7 4.6 2.1 6.2 9.2 0 5.4-6.2 9.2-4.6 2.1-10-2.7-2.9-3.4Z"/></g>
    <path id="ic-spark" d="M0.0 -100.0 L14.5 -35.1 L70.7 -70.7 L35.1 -14.5 L100.0 0.0 L35.1 14.5 L70.7 70.7 L14.5 35.1 L0.0 100.0 L-14.5 35.1 L-70.7 70.7 L-35.1 14.5 L-100.0 0.0 L-35.1 -14.5 L-70.7 -70.7 L-14.5 -35.1 Z"/>
    <path id="ic-burst" d="M0.0 -86.0 L9.1 -63.3 L24.2 -82.5 L26.6 -58.2 L46.5 -72.3 L41.9 -48.4 L65.0 -56.3 L53.8 -34.6 L78.2 -35.7 L61.4 -18.0 L85.1 -12.2 L64.0 -0.0 L85.1 12.2 L61.4 18.0 L78.2 35.7 L53.8 34.6 L65.0 56.3 L41.9 48.4 L46.5 72.3 L26.6 58.2 L24.2 82.5 L9.1 63.3 L0.0 86.0 L-9.1 63.3 L-24.2 82.5 L-26.6 58.2 L-46.5 72.3 L-41.9 48.4 L-65.0 56.3 L-53.8 34.6 L-78.2 35.7 L-61.4 18.0 L-85.1 12.2 L-64.0 0.0 L-85.1 -12.2 L-61.4 -18.0 L-78.2 -35.7 L-53.8 -34.6 L-65.0 -56.3 L-41.9 -48.4 L-46.5 -72.3 L-26.6 -58.2 L-24.2 -82.5 L-9.1 -63.3 Z"/>

    <path id="arc-band" d="M292 150 A 228 62 0 0 1 708 150" fill="none"/>
    <path id="arc-text" d="M292 161 A 228 62 0 0 1 708 161" fill="none"/>

    <pattern id="pat-check" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" class="f-paper"/>
      <rect width="12" height="12" class="f-red"/>
      <rect x="12" y="12" width="12" height="12" class="f-red"/>
    </pattern>
    <pattern id="pat-check-s" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" class="f-paper"/>
      <rect width="8" height="8" class="f-red"/>
      <rect x="8" y="8" width="8" height="8" class="f-red"/>
    </pattern>

    <pattern id="pat-grain" width="150" height="150" patternUnits="userSpaceOnUse">
      <g class="f-grain">
        <circle cx="14" cy="26" r="1.2"/><circle cx="62" cy="10" r="1"/><circle cx="103" cy="34" r="1.3"/>
        <circle cx="140" cy="19" r="1"/><circle cx="36" cy="58" r="1"/><circle cx="81" cy="68" r="1.4"/>
        <circle cx="126" cy="62" r="1"/><circle cx="8" cy="88" r="1.1"/><circle cx="52" cy="101" r="1"/>
        <circle cx="94" cy="94" r="1.2"/><circle cx="136" cy="108" r="1"/><circle cx="23" cy="126" r="1.3"/>
        <circle cx="67" cy="138" r="1"/><circle cx="111" cy="132" r="1.1"/><circle cx="146" cy="145" r="1"/>
      </g>
    </pattern>

    <clipPath id="clip-photo"><rect x="300" y="424" width="400" height="352"/></clipPath>
    <clipPath id="clip-c1"><circle cx="148" cy="506" r="104"/></clipPath>
    <clipPath id="clip-c2"><circle cx="852" cy="506" r="104"/></clipPath>
  </defs>

  <rect width="1000" height="1500" class="f-paper"/>
  <rect width="1000" height="1500" fill="url(#pat-grain)"/>

  <!-- 인쇄 테두리 + 체커 띠 -->
  <rect x="15" y="15" width="970" height="1470" rx="16" class="s-red" fill="none" stroke-width="7"/>
  <rect x="30" y="30" width="940" height="1440" rx="10" class="s-red" fill="none" stroke-width="1.6" opacity=".45"/>
  <rect x="40" y="40" width="920" height="24" fill="url(#pat-check)"/>
  <rect x="40" y="1436" width="920" height="24" fill="url(#pat-check)"/>

  <!-- 간판 : 아치 문구 + 거대 페어명 + 알약 -->
  <use href="#arc-band" class="s-red" stroke-width="52" stroke-linecap="round"/>
  <text class="cond f-on-red" font-size="30" letter-spacing="4">
    <textPath id="archText" href="#arc-text" startOffset="50%" text-anchor="middle">OUR SPECIAL</textPath>
  </text>

  <text id="pairShadow" class="slab f-green s-paper" x="509" y="346" font-size="186" text-anchor="middle"
        paint-order="stroke" stroke-width="15" stroke-linejoin="round">PAIR</text>
  <text id="pairName" class="slab f-red s-paper" x="500" y="336" font-size="186" text-anchor="middle"
        paint-order="stroke" stroke-width="15" stroke-linejoin="round">PAIR</text>

  <rect id="pillBg" class="f-green" y="365" height="54" rx="27"/>
  <text id="pillText" class="cond f-on-green" x="500" y="402" font-size="27" text-anchor="middle" letter-spacing="4">MENU</text>

  <!-- 왼쪽 위 손글씨 + 오른쪽 위 별폭발 배지 -->
  <g transform="rotate(-5 150 150)">
    <g id="scriptL" class="script f-green" font-size="40"></g>
    <path id="scriptLine" class="s-green" fill="none" stroke-width="5" stroke-linecap="round" opacity=".9"/>
  </g>

  <g transform="rotate(6 872 158)">
    <use href="#ic-burst" class="f-green" transform="translate(872,158)"/>
    <g id="badgeText" class="cond f-on-green" font-size="21"></g>
  </g>

  <!-- 가운데 그림 -->
  <g clip-path="url(#clip-photo)">
    <image id="photoImg" preserveAspectRatio="none" style="display:none"/>
  </g>
  <g id="photoHint" class="s-red" fill="none" opacity=".5">
    <g stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="452" y="548" width="96" height="76" rx="10"/>
      <circle cx="478" cy="572" r="7"/>
      <path d="M458 618 l26-30 18 18 14-14 24 22"/>
    </g>
    <text class="script f-red" x="500" y="698" font-size="40" text-anchor="middle" stroke="none">two of us here!</text>
  </g>
  <rect id="photoHit" x="300" y="424" width="400" height="352" fill="none" pointer-events="all"/>

  <!-- 캐릭터 01 -->
  <circle cx="148" cy="506" r="104" class="f-sheet"/>
  <g clip-path="url(#clip-c1)"><image id="c1Img" preserveAspectRatio="none" style="display:none"/></g>
  <g id="c1Hint" class="s-red" fill="none" stroke-width="5" stroke-linecap="round" opacity=".4" transform="translate(148,500) scale(1.25)">
    <circle cx="0" cy="-16" r="17"/>
    <path d="M-30 40 C-30 12 -15 2 0 2 C15 2 30 12 30 40"/>
  </g>
  <circle cx="148" cy="506" r="104" class="s-red" fill="none" stroke-width="7"/>
  <rect id="c1Hit" x="44" y="402" width="208" height="208" fill="none" pointer-events="all"/>
  <g transform="rotate(-3 148 610)">
    <rect id="c1Bar" class="f-red" y="588" height="44" rx="4"/>
    <text id="c1Name" class="cond f-on-red" x="148" y="620" font-size="28" text-anchor="middle" letter-spacing="2.4">JUN</text>
  </g>
  <text id="c1Age" class="cond f-red" x="148" y="672" font-size="19" text-anchor="middle" letter-spacing="1.6">AGE. 19</text>

  <!-- 캐릭터 02 -->
  <circle cx="852" cy="506" r="104" class="f-sheet"/>
  <g clip-path="url(#clip-c2)"><image id="c2Img" preserveAspectRatio="none" style="display:none"/></g>
  <g id="c2Hint" class="s-red" fill="none" stroke-width="5" stroke-linecap="round" opacity=".4" transform="translate(852,500) scale(1.25)">
    <circle cx="0" cy="-16" r="17"/>
    <path d="M-30 40 C-30 12 -15 2 0 2 C15 2 30 12 30 40"/>
  </g>
  <circle cx="852" cy="506" r="104" class="s-red" fill="none" stroke-width="7"/>
  <rect id="c2Hit" x="748" y="402" width="208" height="208" fill="none" pointer-events="all"/>
  <g transform="rotate(3 852 610)">
    <rect id="c2Bar" class="f-red" y="588" height="44" rx="4"/>
    <text id="c2Name" class="cond f-on-red" x="852" y="620" font-size="28" text-anchor="middle" letter-spacing="2.4">HANA</text>
  </g>
  <text id="c2Age" class="cond f-red" x="852" y="672" font-size="19" text-anchor="middle" letter-spacing="1.6">AGE. 18</text>

  <!-- 테두리만 있는 뾰족별. 크기·각도·자리를 일부러 어긋나게 흩뿌린다 -->
  <g class="sparks" fill="none" stroke-linejoin="round">
    <use href="#ic-spark" class="s-red"   stroke-width="7"  transform="translate(80,408) rotate(14) scale(.18)"/>
    <use href="#ic-spark" class="s-green" stroke-width="9"  transform="translate(392,398) rotate(-9) scale(.12)"/>
    <use href="#ic-spark" class="s-red"   stroke-width="8"  transform="translate(936,364) rotate(22) scale(.13)"/>
    <use href="#ic-spark" class="s-green" stroke-width="6"  transform="translate(272,688) rotate(-16) scale(.21)"/>
    <use href="#ic-spark" class="s-red"   stroke-width="9"  transform="translate(736,652) rotate(8) scale(.14)"/>
    <use href="#ic-spark" class="s-green" stroke-width="8"  transform="translate(196,1288) rotate(18) scale(.15)"/>
    <use href="#ic-spark" class="s-red"   stroke-width="10" transform="translate(568,1268) rotate(-12) scale(.11)"/>
  </g>

  <!-- 음식 그림 : 메뉴보다 뒤에 그려 글자가 위로 올라오게 한다 -->
  <g class="slot"><image id="img-burger" class="slot-img" preserveAspectRatio="xMidYMid meet"/><rect id="hit-burger" class="slot-hit" fill="none" pointer-events="all"/></g>
  <g class="slot"><image id="img-pizza"  class="slot-img" preserveAspectRatio="xMidYMid meet"/><rect id="hit-pizza"  class="slot-hit" fill="none" pointer-events="all"/></g>
  <g class="slot"><image id="img-shake"  class="slot-img" preserveAspectRatio="xMidYMid meet"/><rect id="hit-shake"  class="slot-hit" fill="none" pointer-events="all"/></g>

  <!-- 메뉴 3단 -->
  <path d="M348 812 V1400 M652 812 V1400" class="s-red" fill="none" stroke-width="1.6" opacity=".4"/>
  <g id="menu"></g>

  <!-- 바닥 손글씨 -->
  <g transform="rotate(-3 190 1350)"><g id="footL" class="script f-green" font-size="34"></g></g>
  <g id="footC" class="script f-red" font-size="34"></g>
  <use id="footStarL" href="#ic-star" class="f-red"/>
  <use id="footStarR" href="#ic-star" class="f-red"/>

</svg>

  </div>
</div>

<div class="panel">
  <div class="brand">
    <h1>Pair<em>frame</em></h1>
    <p>우리 둘을 다이너 메뉴판의 오늘의 스페셜로</p>
  </div>

  <details class="sec" open>
    <summary>간판</summary>
    <div class="body">
      <label class="fld"><span>페어 이름 <b>(가운데 큰 글씨)</b></span>
        <input id="in-pair" type="text" maxlength="18" placeholder="PAIR"></label>
      <div class="grid2">
        <label class="fld"><span>아치 문구</span>
          <input id="in-arch" type="text" maxlength="18" placeholder="OUR SPECIAL"></label>
        <label class="fld"><span>알약 문구</span>
          <input id="in-pill" type="text" maxlength="12" placeholder="MENU"></label>
      </div>
    </div>
  </details>

  <details class="sec">
    <summary>가운데 그림</summary>
    <div class="body">
      <div class="btn-row">
        <button class="btn" id="btn-photo-pick" type="button">그림 올리기</button>
        <button class="btn ghost" id="btn-photo-clear" type="button">지우기</button>
        <button class="btn ghost" id="btn-photo-reset" type="button">가운데로</button>
      </div>
      <label class="fld range"><span>확대 <b id="lbl-zoom">100%</b></span>
        <input id="in-zoom" type="range" min="100" max="400" step="1" value="100"></label>
      <p class="hint">배경이 투명한 PNG를 올리면 종이에 인쇄된 것처럼 보입니다.
        포스터 위에서 끌어 옮길 수 있어요.</p>
    </div>
  </details>

  <details class="sec"><summary>캐릭터 01</summary><div class="body" data-char="c1"></div></details>
  <details class="sec"><summary>캐릭터 02</summary><div class="body" data-char="c2"></div></details>

  <details class="sec">
    <summary>문구</summary>
    <div class="body">
      <label class="fld"><span>왼쪽 위 <b>손글씨</b> <code>/</code> 로 줄바꿈</span>
        <input id="in-scriptL" type="text" maxlength="40" placeholder="Always / Better / Together"></label>
      <label class="fld"><span>오른쪽 위 <b>배지</b> <code>/</code> 로 줄바꿈</span>
        <input id="in-badge" type="text" maxlength="34" placeholder="TWO HEARTS / ONE / MENU"></label>
      <div class="grid2">
        <label class="fld"><span>왼쪽 아래</span>
          <input id="in-footL" type="text" maxlength="30" placeholder="More Flavor / More Love!"></label>
        <label class="fld"><span>가운데 아래</span>
          <input id="in-footC" type="text" maxlength="24" placeholder="Sweet / & Salty"></label>
      </div>
    </div>
  </details>

  <details class="sec">
    <summary>스페셜 페어 세트</summary>
    <div class="body">
      <p class="hint">메뉴판의 나머지 줄은 고정입니다. 이 한 줄만 두 사람 것으로 바뀝니다.</p>
      <div class="grid2">
        <label class="fld"><span>메뉴 이름</span>
          <input id="in-set" type="text" maxlength="22" placeholder="비우면 두 이름이 들어갑니다"></label>
        <label class="fld"><span>가격</span>
          <input id="in-setp" type="text" maxlength="7" placeholder="$12.5"></label>
      </div>
    </div>
  </details>

  <details class="sec">
    <summary>음식 그림 바꾸기</summary>
    <div class="body">
      <div id="sticker-list" class="stickers"></div>
      <p class="hint">배경이 투명한 PNG를 올리면 기본 그림 대신 들어갑니다.
        포스터 위에서 끌어 옮기고 크기를 조절할 수 있어요.</p>
    </div>
  </details>

  <details class="sec">
    <summary>색상</summary>
    <div class="body">
      <div id="presets" class="presets"></div>
      <div id="color-list" class="colors"></div>
      <button class="btn ghost wide" id="btn-color-reset" type="button">기본 색으로</button>
      <p class="hint">음식 그림은 그려진 색 그대로라 테마를 따르지 않습니다.</p>
    </div>
  </details>

  <div class="actions">
    <button class="btn primary" id="btn-save" type="button">고화질 PNG로 저장</button>
    <button class="btn ghost small" id="btn-reset-all" type="button">전체 초기화</button>
  </div>
</div>

</div>

<input id="in-photo" type="file" accept="image/*" hidden>
<input id="in-sticker" type="file" accept="image/*" hidden>
<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
