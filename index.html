<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pairframe — 페어 다이너 메뉴판 메이커</title>
<meta name="description" content="사진 한 장과 두 사람의 정보로 레트로 다이너 메뉴판 스타일 페어 포스터를 만들고 고화질로 저장하세요.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- ===================== 포스터 ===================== -->
  <div class="stage">
    <div class="stage-inner">
<svg id="poster" viewBox="0 0 1000 1500" preserveAspectRatio="xMidYMid meet" role="img" aria-label="페어 메뉴판 미리보기">

  <defs>
    <!-- 색상 + 폰트는 JS가 여기에 주입한다 (저장 시 그대로 직렬화됨) -->
    <style id="theme-style"></style>

    <g id="ic-heart"><path d="M0 6.6C-1.4 5.4-7.6 1-7.6-2.8-7.6-5.9-5.1-7.7-2.8-7.7-1.2-7.7-.3-6.8 0-5.9 .3-6.8 1.2-7.7 2.8-7.7 5.1-7.7 7.6-5.9 7.6-2.8 7.6 1 1.4 5.4 0 6.6Z"/></g>
    <g id="ic-star"><path d="M0-10 2.9-3.4 10-2.7 4.6 2.1 6.2 9.2 0 5.4-6.2 9.2-4.6 2.1-10-2.7-2.9-3.4Z"/></g>

    <filter id="lift" x="-10%" y="-10%" width="124%" height="124%">
      <feDropShadow dx="2" dy="6" stdDeviation="6" flood-color="#4a3a24" flood-opacity=".2"/>
    </filter>

    <pattern id="pat-check" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" class="f-paper"/>
      <rect width="12" height="12" class="f-red"/>
      <rect x="12" y="12" width="12" height="12" class="f-red"/>
    </pattern>
    <pattern id="pat-check-s" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" class="f-paper"/>
      <rect width="8" height="8" class="f-red"/>
      <rect x="8" y="8" width="8" height="8" class="f-red"/>
    </pattern>
    <pattern id="pat-tape" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" class="f-p1" fill-opacity=".18"/>
      <rect width="7" height="7" class="f-p1" fill-opacity=".5"/>
      <rect x="7" y="7" width="7" height="7" class="f-p1" fill-opacity=".5"/>
    </pattern>

    <pattern id="pat-grain" width="150" height="150" patternUnits="userSpaceOnUse">
      <g class="f-grain">
        <circle cx="14" cy="26" r="1.2"/><circle cx="62" cy="10" r="1"/><circle cx="103" cy="34" r="1.3"/>
        <circle cx="140" cy="19" r="1"/><circle cx="36" cy="58" r="1"/><circle cx="81" cy="68" r="1.4"/>
        <circle cx="126" cy="62" r="1"/><circle cx="8" cy="88" r="1.1"/><circle cx="52" cy="101" r="1"/>
        <circle cx="94" cy="94" r="1.2"/><circle cx="136" cy="108" r="1"/><circle cx="23" cy="126" r="1.3"/>
        <circle cx="67" cy="138" r="1"/><circle cx="111" cy="132" r="1.1"/><circle cx="146" cy="145" r="1"/>
      </g>
    </pattern>

    <clipPath id="clip-photo"><rect x="482" y="280" width="442" height="294" rx="8"/></clipPath>
    <clipPath id="clip-c1"><rect x="64"  y="700" width="152" height="196" rx="8"/></clipPath>
    <clipPath id="clip-c2"><rect x="784" y="700" width="152" height="196" rx="8"/></clipPath>
    <clipPath id="clip-shake"><path d="M18 46 H98 L86 196 Q85 208 74 208 H42 Q31 208 30 196 Z"/></clipPath>
  </defs>

  <rect width="1000" height="1500" class="f-paper"/>
  <rect width="1000" height="1500" fill="url(#pat-grain)"/>

  <rect x="0" y="0" width="1000" height="24" fill="url(#pat-check)"/>
  <rect x="0" y="1476" width="1000" height="24" fill="url(#pat-check)"/>

  <!-- 머리 괘선 : 상단 문구와 전표 번호를 한 줄에 묶는다 -->
  <g>
    <text id="tagLine" class="sans f-green" x="64" y="64" font-size="16" letter-spacing="3">GOOD FOOD • GOOD FRIENDS • BETTER DAYS</text>
    <text class="sans f-red" x="936" y="64" font-size="13" text-anchor="end" letter-spacing="2.6">ORDER No. 042</text>
    <path d="M64 84 H936" class="s-red" fill="none" stroke-width="2" opacity=".5"/>
  </g>

  <!-- 로고 락업 : 페어명 + 부제 + 오른쪽으로 뻗는 괘선 -->
  <g>
    <text id="pairShadow" class="disp f-green s-green" x="71" y="203" font-size="104"
          paint-order="stroke" stroke-width="10" stroke-linejoin="round">Pairname</text>
    <text id="pairName" class="disp f-red s-paper" x="64" y="196" font-size="104"
          paint-order="stroke" stroke-width="12" stroke-linejoin="round">Pairname</text>
    <text id="bn-sub-t" class="sans f-red" x="68" y="250" font-size="17" letter-spacing="6">DINER &amp; GRILL</text>
    <path id="bn-sub-r" class="s-red" fill="none" stroke-width="1.6" opacity=".55"/>
  </g>

  <!-- EST 씰 : 머리 괘선을 뚫고 앉는다 -->
  <g transform="rotate(-5 866 142)">
    <circle cx="866" cy="142" r="56" class="f-paper"/>
    <circle cx="866" cy="142" r="56" class="s-green" fill="none" stroke-width="2.6"/>
    <circle cx="866" cy="142" r="47" class="s-green" fill="none" stroke-width="1.2" stroke-dasharray="2 6" stroke-linecap="round"/>
    <text class="sans f-green" x="866" y="122" font-size="12" text-anchor="middle" letter-spacing="3">EST.</text>
    <text id="estYear" class="sans f-green" x="866" y="160" font-size="30" text-anchor="middle" letter-spacing="1.4">20XX</text>
    <use href="#ic-star" class="f-accent" transform="translate(866,178) scale(.62)"/>
  </g>

  <!-- 메인 사진 : 오른쪽에만 놓아 세로 지배력을 줄인다 -->
  <g id="photoBlock">
    <g filter="url(#lift)">
      <rect x="470" y="268" width="466" height="318" rx="14" class="f-sheet"/>
    </g>
    <rect x="470" y="268" width="466" height="318" rx="14" class="s-red" fill="none" stroke-width="3.5"/>
    <rect x="477" y="275" width="452" height="304" rx="10" class="s-red" fill="none" stroke-width="1.2" opacity=".7"/>
    <rect x="482" y="280" width="442" height="294" rx="8" class="f-glight"/>
    <g clip-path="url(#clip-photo)">
      <image id="photoImg" preserveAspectRatio="none" style="display:none"/>
    </g>
    <g id="photoHint">
      <g class="s-green" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity=".8">
        <rect x="669" y="404" width="68" height="56" rx="8"/>
        <circle cx="688" cy="422" r="5"/>
        <path d="M673 453 l19-21 13 13 10-10 17 15"/>
        <path d="M647 412 l-13-8 M645 436 l-15 3 M653 456 l-12 10 M759 412 l13-8 M761 436 l15 3 M753 456 l12 10"/>
      </g>
      <text class="hand f-green" x="703" y="504" font-size="34" text-anchor="middle">photo here!</text>
      <use href="#ic-heart" class="f-green" transform="translate(703,524) scale(1.1)"/>
    </g>
    <rect x="482" y="280" width="442" height="294" rx="8" class="s-red" fill="none" stroke-width="2.4"/>
    <rect id="photoHit" x="482" y="280" width="442" height="294" rx="8" fill="none" pointer-events="all"/>
  </g>

  <!-- 마스킹 테이프 : 사진 오른쪽 위 모서리를 물고 기둥 밖으로 나간다 -->
  <g transform="rotate(24 928 272)">
    <rect x="878" y="258" width="100" height="26" fill="url(#pat-tape)"/>
    <rect x="878" y="258" width="100" height="26" class="s-p1" fill="none" stroke-width="1" opacity=".45"/>
  </g>

  <!-- TODAY'S SPECIAL 깃발 : 끝이 사진 테두리에 닿는다 -->
  <g>
    <path id="bn-sp-p" class="f-red"/>
    <use id="bn-sp-i" href="#ic-star" class="f-accent" transform="translate(88,318) scale(.85)"/>
    <text id="bn-sp-t" class="sans f-on-red" x="110" y="325" font-size="21" letter-spacing="4">TODAY'S SPECIAL</text>
  </g>

  <!-- 사진 왼쪽 빈 열 : 손글씨 메모 -->
  <g>
    <text class="sans f-red" x="68" y="392" font-size="12" letter-spacing="3.4">HOUSE FAVORITE</text>
    <path d="M68 402 H240" class="s-red" fill="none" stroke-width="1.4" opacity=".5"/>
    <g id="noteLines" class="hand f-red" font-size="30"></g>
    <path d="M70 542 q86 12 176 1" class="s-red" fill="none" stroke-width="3" stroke-linecap="round" opacity=".85"/>
  </g>

  <!-- 페어 괘선 + 가운데 하트 메달 -->
  <g>
    <path d="M64 640 H936" class="s-green" fill="none" stroke-width="2" opacity=".55"/>
    <path id="bn-pr-p" class="f-green"/>
    <use id="bn-pr-i" href="#ic-star" class="f-accent" transform="translate(88,640) scale(.85)"/>
    <text id="bn-pr-t" class="sans f-on-green" x="110" y="647" font-size="19" letter-spacing="4">OUR SPECIAL PAIR</text>
    <text class="sans f-green" x="936" y="632" font-size="12" text-anchor="end" letter-spacing="2.6">TABLE 02 · SERVES 2</text>

  </g>

  <!-- 페어 : 상자 없이 종이에 인쇄된 한 코너. 두 열이 아니라 지면을 가로지르는 행으로 읽히게 한다 -->
  <g>
    <rect x="64" y="700" width="152" height="196" rx="8" class="f-p1" fill-opacity=".14"/>
    <g clip-path="url(#clip-c1)"><image id="c1Img" preserveAspectRatio="none" style="display:none"/></g>
    <g id="c1Hint" class="s-p1" fill="none" stroke-width="5" stroke-linecap="round" opacity=".45"
       transform="translate(140,798)">
      <circle cx="0" cy="-28" r="18"/>
      <path d="M-32 34 C-32 8 -16 -2 0 -2 C16 -2 32 8 32 34"/>
    </g>
    <rect x="64" y="700" width="152" height="196" rx="8" class="s-p1" fill="none" stroke-width="2.4"/>
    <rect id="c1Hit" x="64" y="700" width="152" height="196" rx="8" fill="none" pointer-events="all"/>

    <use href="#ic-heart" class="f-p1" transform="translate(250,746) scale(.8)"/>
    <text class="sans f-p1" x="266" y="750" font-size="12" letter-spacing="2.6">NO. 01</text>
    <text id="c1Name" class="disp f-ink" x="244" y="806" font-size="40">character 1</text>
    <text id="c1Meta" class="sans f-p1" x="244" y="838" font-size="15" letter-spacing="2.6">26 · BARISTA</text>
  </g>

  <g>
    <rect x="784" y="700" width="152" height="196" rx="8" class="f-p2" fill-opacity=".14"/>
    <g clip-path="url(#clip-c2)"><image id="c2Img" preserveAspectRatio="none" style="display:none"/></g>
    <g id="c2Hint" class="s-p2" fill="none" stroke-width="5" stroke-linecap="round" opacity=".45"
       transform="translate(860,798)">
      <circle cx="0" cy="-28" r="18"/>
      <path d="M-32 34 C-32 8 -16 -2 0 -2 C16 -2 32 8 32 34"/>
    </g>
    <rect x="784" y="700" width="152" height="196" rx="8" class="s-p2" fill="none" stroke-width="2.4"/>
    <rect id="c2Hit" x="784" y="700" width="152" height="196" rx="8" fill="none" pointer-events="all"/>

    <use href="#ic-star" class="f-p2" transform="translate(688,746) scale(.75)"/>
    <text class="sans f-p2" x="756" y="750" font-size="12" text-anchor="end" letter-spacing="2.6">NO. 02</text>
    <text id="c2Name" class="disp f-ink" x="756" y="806" font-size="40" text-anchor="end">character 2</text>
    <text id="c2Meta" class="sans f-p2" x="756" y="838" font-size="15" text-anchor="end" letter-spacing="2.6">28 · DESIGNER</text>
  </g>

  <!-- 두 이름 사이의 하트. 장식 배지가 아니라 A 와 B 를 잇는 글자다 -->
  <use href="#ic-heart" class="f-red" transform="translate(500,792) scale(2.4)"/>

  <!-- 공유 행 : 괘선이 64 에서 936 까지 관통하고 라벨이 가운데 홈통에 앉는다 -->
  <g>
    <path d="M64 926 H936" class="s-red" fill="none" stroke-width="1.4" opacity=".45"/>
    <rect id="rowLikeBg" class="f-paper" y="912" height="26"/>
    <use id="rowLikeI" href="#ic-heart" class="f-red"/>
    <text id="rowLikeT" class="sans f-red" y="931" font-size="13" letter-spacing="3">LIKES</text>
    <text id="c1Like" class="hand f-ink" x="64" y="978" font-size="28">Cheeseburger</text>
    <path id="rowLikeD" class="s-red" fill="none" stroke-width="1.6" stroke-dasharray="2 8" stroke-linecap="round" opacity=".5"/>
    <text id="c2Like" class="hand f-ink" x="936" y="978" font-size="28" text-anchor="end">Strawberry shake</text>

    <path d="M64 1026 H936" class="s-red" fill="none" stroke-width="1.4" opacity=".45"/>
    <rect id="rowPickBg" class="f-paper" y="1012" height="26"/>
    <use id="rowPickI" href="#ic-star" class="f-accent"/>
    <text id="rowPickT" class="sans f-red" y="1031" font-size="13" letter-spacing="3">TODAY'S PICK</text>
    <text id="c1Pick" class="hand f-p1" x="64" y="1078" font-size="28">character 2</text>
    <path id="rowPickD" class="s-red" fill="none" stroke-width="1.6" stroke-dasharray="2 8" stroke-linecap="round" opacity=".5"/>
    <text id="c2Pick" class="hand f-p2" x="936" y="1078" font-size="28" text-anchor="end">character 1</text>
  </g>

  <!-- 오늘의 메뉴 : 상자를 없애고 괘선 + 한 줄로 압축 -->
  <g>
    <path d="M64 1140 H936" class="s-green" fill="none" stroke-width="2" opacity=".55"/>
    <path id="bn-mn-p" class="f-green"/>
    <use id="bn-mn-i" href="#ic-star" class="f-accent" transform="translate(88,1140) scale(.85)"/>
    <text id="bn-mn-t" class="sans f-on-green" x="110" y="1147" font-size="19" letter-spacing="4">TODAY'S MENU</text>
    <text class="sans f-green" x="936" y="1132" font-size="12" text-anchor="end" letter-spacing="2.6">MADE FOR TWO</text>
    <g id="menu-rows"></g>
  </g>

  <!-- 바닥 괘선 : 문구가 괘선 위에 앉고, 왼쪽 버거와 오른쪽 도장이 괘선을 가로지른다 -->
  <g>
    <path d="M64 1300 H936" class="s-red" fill="none" stroke-width="1.6" stroke-dasharray="3 8" stroke-linecap="round" opacity=".6"/>
    <rect id="atBg" class="f-paper" x="380" y="1286" width="240" height="28"/>
    <use id="atL" href="#ic-heart" class="f-red" transform="translate(410,1300) scale(1.1)"/>
    <text id="atText" class="sans f-red" x="500" y="1306" font-size="17" text-anchor="middle" letter-spacing="5">ALWAYS TOGETHER</text>
    <use id="atR" href="#ic-heart" class="f-red" transform="translate(590,1300) scale(1.1)"/>

    <text id="footText" class="sans f-green" x="268" y="1352" font-size="15" letter-spacing="3.4">ALWAYS TOGETHER, ALWAYS HUNGRY</text>
    <g transform="rotate(-8 876 1320)">
      <circle cx="876" cy="1320" r="36" class="f-paper"/>
      <circle cx="876" cy="1320" r="36" class="s-red" fill="none" stroke-width="2.6"/>
      <circle cx="876" cy="1320" r="30" class="s-red" fill="none" stroke-width="1.2" stroke-dasharray="2 6" stroke-linecap="round"/>
      <text class="hand f-red" x="876" y="1331" font-size="32" text-anchor="middle">xoxo</text>
    </g>
  </g>

  <!-- 스티커 3종. 옮긴 스티커가 다른 요소 뒤로 숨지 않도록 가장 위에 그린다 -->
  <g class="slot">
    <g id="art-shake" transform="translate(384,375)">
      <path d="M52 42 L36 -8" class="s-red" stroke-width="7" stroke-linecap="round" fill="none"/>
      <path d="M70 42 L88 -4" class="s-red" stroke-width="7" stroke-linecap="round" fill="none"/>
      <circle cx="60" cy="6" r="10" class="f-red"/>
      <path d="M60 -3 Q66 -16 80 -18" class="s-green" fill="none" stroke-width="3" stroke-linecap="round"/>
      <path d="M20 48 C20 30 33 21 44 26 C47 11 68 9 74 22 C89 18 99 31 94 48 Z" class="f-sheet s-red" stroke-width="3"/>
      <g clip-path="url(#clip-shake)">
        <rect x="18" y="46" width="80" height="164" class="f-sheet"/>
        <rect x="20" y="46" width="15" height="164" class="f-red"/>
        <rect x="52" y="46" width="15" height="164" class="f-red"/>
        <rect x="84" y="46" width="15" height="164" class="f-red"/>
        <rect x="18" y="96" width="80" height="60" class="f-sheet"/>
      </g>
      <path d="M18 46 H98 L86 196 Q85 208 74 208 H42 Q31 208 30 196 Z" class="s-red" fill="none" stroke-width="3.4"/>
      <path d="M18 96 H97 M20 156 H95" class="s-red" stroke-width="2" opacity=".5"/>
      <text class="hand f-red" x="58" y="124" font-size="21" text-anchor="middle">Sweet</text>
      <text class="hand f-red" x="58" y="148" font-size="21" text-anchor="middle">&amp; Cool</text>
    </g>
    <image id="img-shake" class="slot-img" preserveAspectRatio="xMidYMid meet"/>
    <rect id="hit-shake" class="slot-hit" fill="none" pointer-events="all"/>
  </g>

  <g class="slot">
    <g id="art-fries" transform="translate(867,519) scale(.68)">
      <g class="f-fry s-food" stroke-width="2.4">
        <rect x="13" y="8" width="14" height="52" rx="4" transform="rotate(-12 20 34)"/>
        <rect x="53" y="8" width="14" height="52" rx="4" transform="rotate(12 60 34)"/>
        <rect x="24" y="14" width="13" height="48" rx="4" transform="rotate(-5 30 38)"/>
        <rect x="45" y="12" width="13" height="50" rx="4" transform="rotate(6 51 37)"/>
        <rect x="34" y="0" width="14" height="62" rx="4"/>
      </g>
      <path d="M2 52 H82 L72 128 q-1 9 -10 9 H22 q-9 0-10-9 Z" fill="url(#pat-check-s)" class="s-red" stroke-width="3.4"/>
      <path d="M2 52 H82" class="s-red" stroke-width="3.4"/>
    </g>
    <image id="img-fries" class="slot-img" preserveAspectRatio="xMidYMid meet"/>
    <rect id="hit-fries" class="slot-hit" fill="none" pointer-events="all"/>
  </g>

  <g class="slot">
    <g id="art-burger" transform="translate(83,1226) scale(.85)">
      <ellipse cx="84" cy="158" rx="82" ry="15" class="f-sheet s-red" stroke-width="3"/>
      <g transform="translate(84,100)">
        <path d="M-50 40 H50 C50 51 42 58 31 58 H-31 C-42 58 -50 51 -50 40 Z" class="f-bun s-food" stroke-width="2.8"/>
        <rect x="-53" y="26" width="106" height="18" rx="9" class="f-patty s-food" stroke-width="2.8"/>
        <path d="M-57 12 H57 L52 21 L46 33 L35 21 L25 34 L14 21 L2 33 L-10 21 L-22 34 L-33 21 L-44 33 L-52 21 Z" class="f-cheese s-food" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M-55 -2 C-47 -11 -39 3 -31 -5 C-23 -13 -15 1 -7 -6 C1 -13 9 1 17 -6 C25 -13 33 2 41 -5 C47 -10 53 -6 55 -1 C54 9 46 13 39 9 C31 15 23 8 17 12 C9 17 1 10 -7 13 C-15 16 -23 9 -31 12 C-39 15 -47 9 -55 -2 Z" class="f-lettuce s-food" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M-50 2 C-50 -26 -28 -42 0 -42 C28 -42 50 -26 50 2 Z" class="f-bun s-food" stroke-width="2.8"/>
        <g class="f-sesame">
          <ellipse cx="-30" cy="-16" rx="4.8" ry="2.7" transform="rotate(-30 -30 -16)"/>
          <ellipse cx="-12" cy="-28" rx="4.8" ry="2.7" transform="rotate(-12 -12 -28)"/>
          <ellipse cx="8" cy="-29" rx="4.8" ry="2.7" transform="rotate(10 8 -29)"/>
          <ellipse cx="26" cy="-19" rx="4.8" ry="2.7" transform="rotate(28 26 -19)"/>
          <ellipse cx="-41" cy="-4" rx="4.4" ry="2.5" transform="rotate(-54 -41 -4)"/>
          <ellipse cx="41" cy="-4" rx="4.4" ry="2.5" transform="rotate(54 41 -4)"/>
          <ellipse cx="-2" cy="-14" rx="4.4" ry="2.5" transform="rotate(-6 -2 -14)"/>
          <ellipse cx="18" cy="-8" rx="4.2" ry="2.4" transform="rotate(36 18 -8)"/>
          <ellipse cx="-21" cy="-6" rx="4.2" ry="2.4" transform="rotate(-38 -21 -6)"/>
        </g>
      </g>
    </g>
    <image id="img-burger" class="slot-img" preserveAspectRatio="xMidYMid meet"/>
    <rect id="hit-burger" class="slot-hit" fill="none" pointer-events="all"/>
  </g>

</svg>
    </div>
  </div>

  <!-- ===================== 편집 패널 ===================== -->
  <div class="panel">
    <header class="brand">
      <h1>Pair<em>frame</em></h1>
      <p>우리 둘을 다이너 메뉴판의 오늘의 스페셜로</p>
    </header>

    <details class="sec" open>
      <summary>간판</summary>
      <div class="body">
        <label class="fld"><span>페어 이름</span>
          <input id="in-pair" type="text" maxlength="18" placeholder="Pairname"></label>
        <div class="grid2">
          <label class="fld"><span>부제</span>
            <input id="in-sub" type="text" maxlength="20" placeholder="DINER &amp; GRILL"></label>
          <label class="fld"><span>설립 연도</span>
            <input id="in-est" type="text" maxlength="6" placeholder="20XX"></label>
        </div>
        <label class="fld"><span>상단 문구</span>
          <input id="in-tag" type="text" maxlength="46" placeholder="GOOD FOOD • GOOD FRIENDS • BETTER DAYS"></label>
      </div>
    </details>

    <details class="sec" open>
      <summary>메인 사진</summary>
      <div class="body">
        <div class="btn-row">
          <button class="btn" id="btn-photo-pick" type="button">사진 올리기</button>
          <button class="btn ghost" id="btn-photo-clear" type="button">지우기</button>
        </div>
        <input id="in-photo" type="file" accept="image/*" hidden>
        <label class="fld range"><span>확대 <b id="lbl-zoom">100%</b></span>
          <input id="in-zoom" type="range" min="100" max="400" step="1" value="100"></label>
        <button class="btn ghost wide" id="btn-photo-reset" type="button">위치·확대 초기화</button>
        <p class="hint">사진을 끌어 위치를 맞추고, 두 손가락 또는 휠로 확대할 수 있어요.
          캐릭터 사진도 같은 방법으로 조정합니다.</p>
      </div>
    </details>

    <details class="sec">
      <summary>캐릭터 01</summary>
      <div class="body" data-char="c1"></div>
    </details>

    <details class="sec">
      <summary>캐릭터 02</summary>
      <div class="body" data-char="c2"></div>
    </details>

    <details class="sec">
      <summary>오늘의 메뉴</summary>
      <div class="body">
        <div class="grid2" id="menu-inputs"></div>
        <label class="fld"><span>오른쪽 메모 (<code>/</code> 로 줄바꿈, 3줄까지)</span>
          <input id="in-note" type="text" maxlength="60" placeholder="Same table / Different worlds / One story"></label>
        <label class="fld"><span>가운데 문구</span>
          <input id="in-always" type="text" maxlength="30" placeholder="ALWAYS TOGETHER"></label>
        <label class="fld"><span>맨 아래 문구</span>
          <input id="in-foot" type="text" maxlength="46" placeholder="ALWAYS TOGETHER, ALWAYS HUNGRY"></label>
      </div>
    </details>

    <details class="sec">
      <summary>스티커 바꾸기</summary>
      <div class="body">
        <p class="hint">배경이 지워진 PNG를 올리면 해당 자리의 일러스트가 교체됩니다.
          올린 뒤에는 포스터 위에서 끌어 옮기고, 슬라이더로 크기를 맞출 수 있어요.</p>
        <div class="stickers" id="sticker-list"></div>
        <input id="in-sticker" type="file" accept="image/*" hidden>
      </div>
    </details>

    <details class="sec">
      <summary>색상</summary>
      <div class="body">
        <div class="presets" id="presets"></div>
        <div class="colors" id="color-list"></div>
        <button class="btn ghost wide" id="btn-color-reset" type="button">색상 초기화</button>
      </div>
    </details>

    <div class="actions">
      <button class="btn primary" id="btn-save" type="button">고화질 PNG로 저장</button>
      <button class="btn ghost small" id="btn-reset-all" type="button">전체 초기화</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
