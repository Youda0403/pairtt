<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pairframe — 페어 다이너 메뉴판 메이커</title>
<meta name="description" content="사진 한 장과 두 사람의 정보로 레트로 다이너 메뉴판 스타일 페어 포스터를 만들고 고화질로 저장하세요.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- ===================== 포스터 ===================== -->
  <div class="stage">
    <div class="stage-inner">
<svg id="poster" viewBox="0 0 1000 1500" preserveAspectRatio="xMidYMid meet" role="img" aria-label="페어 메뉴판 미리보기">

  <defs>
    <!-- 색상 + 폰트는 JS가 여기에 주입한다 (저장 시 그대로 직렬화됨) -->
    <style id="theme-style"></style>

    <g id="ic-heart"><path d="M0 6.6C-1.4 5.4-7.6 1-7.6-2.8-7.6-5.9-5.1-7.7-2.8-7.7-1.2-7.7-.3-6.8 0-5.9 .3-6.8 1.2-7.7 2.8-7.7 5.1-7.7 7.6-5.9 7.6-2.8 7.6 1 1.4 5.4 0 6.6Z"/></g>
    <g id="ic-star"><path d="M0-10 2.9-3.4 10-2.7 4.6 2.1 6.2 9.2 0 5.4-6.2 9.2-4.6 2.1-10-2.7-2.9-3.4Z"/></g>

    <filter id="lift" x="-10%" y="-10%" width="124%" height="124%">
      <feDropShadow dx="2" dy="6" stdDeviation="6" flood-color="#4a3a24" flood-opacity=".2"/>
    </filter>

    <pattern id="pat-check" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" class="f-paper"/>
      <rect width="12" height="12" class="f-red"/>
      <rect x="12" y="12" width="12" height="12" class="f-red"/>
    </pattern>
    <pattern id="pat-check-s" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" class="f-paper"/>
      <rect width="8" height="8" class="f-red"/>
      <rect x="8" y="8" width="8" height="8" class="f-red"/>
    </pattern>
    <pattern id="pat-tape" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" class="f-p1" fill-opacity=".18"/>
      <rect width="7" height="7" class="f-p1" fill-opacity=".5"/>
      <rect x="7" y="7" width="7" height="7" class="f-p1" fill-opacity=".5"/>
    </pattern>

    <pattern id="pat-grain" width="150" height="150" patternUnits="userSpaceOnUse">
      <g class="f-grain">
        <circle cx="14" cy="26" r="1.2"/><circle cx="62" cy="10" r="1"/><circle cx="103" cy="34" r="1.3"/>
        <circle cx="140" cy="19" r="1"/><circle cx="36" cy="58" r="1"/><circle cx="81" cy="68" r="1.4"/>
        <circle cx="126" cy="62" r="1"/><circle cx="8" cy="88" r="1.1"/><circle cx="52" cy="101" r="1"/>
        <circle cx="94" cy="94" r="1.2"/><circle cx="136" cy="108" r="1"/><circle cx="23" cy="126" r="1.3"/>
        <circle cx="67" cy="138" r="1"/><circle cx="111" cy="132" r="1.1"/><circle cx="146" cy="145" r="1"/>
      </g>
    </pattern>

    <clipPath id="clip-photo"><rect x="154" y="364" width="692" height="336" rx="10"/></clipPath>
    <clipPath id="clip-c1"><rect x="90" y="810" width="148" height="200" rx="10"/></clipPath>
    <clipPath id="clip-c2"><rect x="534" y="810" width="148" height="200" rx="10"/></clipPath>
    <clipPath id="clip-shake"><path d="M18 46 H98 L86 196 Q85 208 74 208 H42 Q31 208 30 196 Z"/></clipPath>
  </defs>

  <rect width="1000" height="1500" class="f-paper"/>
  <rect width="1000" height="1500" fill="url(#pat-grain)"/>

  <rect x="0" y="0" width="1000" height="26" fill="url(#pat-check)"/>
  <rect x="0" y="1474" width="1000" height="26" fill="url(#pat-check)"/>

  <!-- 상단 문구 + EST 배지 (기둥 오른쪽 끝 936 에 정렬) -->
  <g>
    <use id="tagStarL" href="#ic-star" class="f-red" transform="translate(300,54) scale(.9)"/>
    <text id="tagLine" class="sans f-green" x="486" y="60" font-size="17" text-anchor="middle" letter-spacing="3">GOOD FOOD • GOOD FRIENDS • BETTER DAYS</text>
    <use id="tagStarR" href="#ic-star" class="f-red" transform="translate(672,54) scale(.9)"/>
    <path d="M288 78 Q486 102 684 78" class="s-green" fill="none" stroke-width="5" stroke-linecap="round"/>
    <path d="M320 88 Q486 106 652 88" class="s-green" fill="none" stroke-width="2" stroke-linecap="round" opacity=".7"/>

    <rect x="814" y="36" width="122" height="58" rx="29" class="s-green" fill="none" stroke-width="3"/>
    <text class="sans f-green" x="875" y="60" font-size="13" text-anchor="middle" letter-spacing="2.4">EST.</text>
    <text id="estYear" class="sans f-green" x="875" y="82" font-size="19" text-anchor="middle" letter-spacing="1.6">20XX</text>
  </g>

  <!-- 페어명 : 다이너 간판처럼 (그린 그림자 + 크림 아웃라인 + 레드) -->
  <g>
    <text id="pairShadow" class="disp f-green s-green" x="507" y="233" font-size="168" text-anchor="middle"
          paint-order="stroke" stroke-width="13" stroke-linejoin="round">Pairname</text>
    <text id="pairName" class="disp f-red s-paper" x="500" y="226" font-size="168" text-anchor="middle"
          paint-order="stroke" stroke-width="17" stroke-linejoin="round">Pairname</text>
  </g>

  <!-- DINER &amp; GRILL 리본 : 타이틀 디센더에 걸치는 부제 -->
  <g>
    <path id="bn-sub-p" class="f-red"/>
    <text id="bn-sub-t" class="sans f-on-red" x="500" y="271" font-size="19" text-anchor="middle" letter-spacing="5">DINER &amp; GRILL</text>
  </g>

  <!-- 메인 사진 카드 (기둥 안에서 720 폭, 장식이 올라탄다) -->
  <g id="photoBlock">
    <g filter="url(#lift)">
      <rect x="140" y="346" width="720" height="368" rx="18" class="f-sheet"/>
    </g>
    <rect x="140" y="346" width="720" height="368" rx="18" class="s-red" fill="none" stroke-width="3.5"/>
    <rect x="147" y="353" width="706" height="354" rx="13" class="s-red" fill="none" stroke-width="1.2" opacity=".75"/>
    <rect x="154" y="364" width="692" height="336" rx="10" class="f-glight"/>
    <g clip-path="url(#clip-photo)">
      <image id="photoImg" preserveAspectRatio="none" style="display:none"/>
    </g>
    <g id="photoHint">
      <g class="s-green" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity=".8">
        <rect x="466" y="477" width="68" height="56" rx="8"/>
        <circle cx="485" cy="495" r="5"/>
        <path d="M470 526 l19-21 13 13 10-10 17 15"/>
        <path d="M444 485 l-13-8 M442 509 l-15 3 M450 529 l-12 10 M556 485 l13-8 M558 509 l15 3 M550 529 l12 10"/>
      </g>
      <text class="hand f-green" x="500" y="577" font-size="34" text-anchor="middle">photo here!</text>
      <use href="#ic-heart" class="f-green" transform="translate(500,597) scale(1.1)"/>
    </g>
    <rect x="154" y="364" width="692" height="336" rx="10" class="s-red" fill="none" stroke-width="2.6"/>
    <rect id="photoHit" x="154" y="364" width="692" height="336" rx="10" fill="none" pointer-events="all"/>
  </g>

  <!-- TODAY'S SPECIAL 배너 : 사진 카드 위 가장자리에 얹힌다 -->
  <g>
    <path id="bn-sp-p" class="f-red"/>
    <use id="bn-sp-l" href="#ic-star" class="f-accent" transform="translate(400,333) scale(.85)"/>
    <text id="bn-sp-t" class="sans f-on-red" x="500" y="340" font-size="21" text-anchor="middle" letter-spacing="4">TODAY'S SPECIAL</text>
    <use id="bn-sp-r" href="#ic-star" class="f-accent" transform="translate(600,333) scale(.85)"/>
  </g>

  <!-- OUR STORY 하트 배지 : 사진 카드 왼쪽 위 모서리에 올라탄다 -->
  <g transform="rotate(-8 126 378)">
    <use href="#ic-heart" class="f-red" transform="translate(126,376) scale(6.6)"/>
    <text class="sans f-on-red" x="126" y="366" font-size="15" text-anchor="middle" letter-spacing="1.6">OUR</text>
    <text class="sans f-on-red" x="126" y="388" font-size="15" text-anchor="middle" letter-spacing="1.6">STORY</text>
  </g>

  <!-- Better Together 티켓 : 사진 카드 오른쪽 위 모서리에 올라탄다 -->
  <g transform="rotate(5 872 408)">
    <g filter="url(#lift)">
      <path class="f-sheet" d="M812 348 H932 V468 L922 460 L912 468 L902 460 L892 468 L882 460 L872 468 L862 460 L852 468 L842 460 L832 468 L822 460 L812 468 Z"/>
    </g>
    <path class="s-red" fill="none" stroke-width="2" stroke-dasharray="1.5 6" stroke-linecap="round"
          d="M820 358 H924 V456"/>
    <text class="hand f-red" x="872" y="404" font-size="26" text-anchor="middle">Better</text>
    <text class="hand f-red" x="872" y="432" font-size="26" text-anchor="middle">Together</text>
    <use href="#ic-heart" class="f-red" transform="translate(872,448) scale(1.1)"/>
    <g transform="rotate(-14 872 348)">
      <rect x="822" y="334" width="100" height="26" fill="url(#pat-tape)"/>
      <rect x="822" y="334" width="100" height="26" class="s-p1" fill="none" stroke-width="1" opacity=".5"/>
    </g>
  </g>

  <!-- OUR SPECIAL PAIR 배너 -->
  <g>
    <path id="bn-pr-p" class="f-red"/>
    <use id="bn-pr-l" href="#ic-star" class="f-accent" transform="translate(390,739) scale(.85)"/>
    <text id="bn-pr-t" class="sans f-on-red" x="500" y="746" font-size="21" text-anchor="middle" letter-spacing="4">OUR SPECIAL PAIR</text>
    <use id="bn-pr-r" href="#ic-star" class="f-accent" transform="translate(610,739) scale(.85)"/>
  </g>

  <!-- 캐릭터 카드 1 : 그림자 없이 선만 (웹 카드처럼 보이지 않게) -->
  <g>
    <rect x="64" y="776" width="428" height="328" rx="14" class="f-sheet"/>
    <rect x="64" y="776" width="428" height="328" rx="14" class="s-p1" fill="none" stroke-width="3"/>

    <rect x="90" y="810" width="148" height="200" rx="10" class="f-p1" fill-opacity=".16"/>
    <g clip-path="url(#clip-c1)"><image id="c1Img" preserveAspectRatio="none" style="display:none"/></g>
    <g id="c1Hint" class="s-p1" fill="none" stroke-width="5" stroke-linecap="round" opacity=".5"
       transform="translate(164,910)">
      <circle cx="0" cy="-22" r="19"/>
      <path d="M-33 34 C-33 7 -17 -3 0 -3 C17 -3 33 7 33 34"/>
    </g>
    <rect x="90" y="810" width="148" height="200" rx="10" class="s-p1" fill="none" stroke-width="2.4"/>
    <rect id="c1Hit" x="90" y="810" width="148" height="200" rx="10" fill="none" pointer-events="all"/>

    <g id="row-1n"><text class="sans lbl f-p1" x="260" y="840">NAME</text><text class="sans lbl f-p1 colon" y="840">:</text><path class="dash s-p1"/><text class="hand val f-ink" y="835"></text></g>
    <g id="row-1a"><text class="sans lbl f-p1" x="260" y="884">AGE</text><text class="sans lbl f-p1 colon" y="884">:</text><path class="dash s-p1"/><text class="hand val f-ink" y="879"></text></g>
    <g id="row-1j"><text class="sans lbl f-p1" x="260" y="928">JOB</text><text class="sans lbl f-p1 colon" y="928">:</text><path class="dash s-p1"/><text class="hand val f-ink" y="923"></text></g>
    <g id="row-1l"><text class="sans lbl f-p1" x="260" y="972">LIKE</text><text class="sans lbl f-p1 colon" y="972">:</text><path class="dash s-p1"/><text class="hand val f-ink" y="967"></text></g>

    <path id="bn-o1-p" class="f-p1"/>
    <text id="bn-o1-t" class="sans f-on-p1" x="102" y="1056" font-size="14" letter-spacing="2.4">TODAY'S ORDER</text>
    <text id="c1Order" class="hand f-p1" x="294" y="1058" font-size="27">character 2</text>

    <path id="bn-c1-p" class="f-p1"/>
    <use id="bn-c1-i" href="#ic-heart" class="f-on-p1" transform="translate(102,776) scale(1.1)"/>
    <text id="bn-c1-t" class="sans f-on-p1" x="120" y="782" font-size="16" letter-spacing="2.6">CHARACTER 01</text>
  </g>

  <!-- 캐릭터 카드 2 -->
  <g>
    <rect x="508" y="776" width="428" height="328" rx="14" class="f-sheet"/>
    <rect x="508" y="776" width="428" height="328" rx="14" class="s-p2" fill="none" stroke-width="3"/>

    <rect x="534" y="810" width="148" height="200" rx="10" class="f-p2" fill-opacity=".16"/>
    <g clip-path="url(#clip-c2)"><image id="c2Img" preserveAspectRatio="none" style="display:none"/></g>
    <g id="c2Hint" class="s-p2" fill="none" stroke-width="5" stroke-linecap="round" opacity=".5"
       transform="translate(608,910)">
      <circle cx="0" cy="-22" r="19"/>
      <path d="M-33 34 C-33 7 -17 -3 0 -3 C17 -3 33 7 33 34"/>
    </g>
    <rect x="534" y="810" width="148" height="200" rx="10" class="s-p2" fill="none" stroke-width="2.4"/>
    <rect id="c2Hit" x="534" y="810" width="148" height="200" rx="10" fill="none" pointer-events="all"/>

    <g id="row-2n"><text class="sans lbl f-p2" x="704" y="840">NAME</text><text class="sans lbl f-p2 colon" y="840">:</text><path class="dash s-p2"/><text class="hand val f-ink" y="835"></text></g>
    <g id="row-2a"><text class="sans lbl f-p2" x="704" y="884">AGE</text><text class="sans lbl f-p2 colon" y="884">:</text><path class="dash s-p2"/><text class="hand val f-ink" y="879"></text></g>
    <g id="row-2j"><text class="sans lbl f-p2" x="704" y="928">JOB</text><text class="sans lbl f-p2 colon" y="928">:</text><path class="dash s-p2"/><text class="hand val f-ink" y="923"></text></g>
    <g id="row-2l"><text class="sans lbl f-p2" x="704" y="972">LIKE</text><text class="sans lbl f-p2 colon" y="972">:</text><path class="dash s-p2"/><text class="hand val f-ink" y="967"></text></g>

    <path id="bn-o2-p" class="f-p2"/>
    <text id="bn-o2-t" class="sans f-on-p2" x="546" y="1056" font-size="14" letter-spacing="2.4">TODAY'S ORDER</text>
    <text id="c2Order" class="hand f-p2" x="738" y="1058" font-size="27">character 1</text>

    <path id="bn-c2-p" class="f-p2"/>
    <use id="bn-c2-i" href="#ic-star" class="f-on-p2" transform="translate(546,776) scale(1.1)"/>
    <text id="bn-c2-t" class="sans f-on-p2" x="564" y="782" font-size="16" letter-spacing="2.6">CHARACTER 02</text>
  </g>

  <!-- ALWAYS TOGETHER -->
  <g>
    <use id="atL" href="#ic-heart" class="f-red" transform="translate(410,1138) scale(1.1)"/>
    <text id="atText" class="sans f-red" x="500" y="1144" font-size="16" text-anchor="middle" letter-spacing="4">ALWAYS TOGETHER</text>
    <use id="atR" href="#ic-heart" class="f-red" transform="translate(590,1138) scale(1.1)"/>
  </g>

  <!-- TODAY'S MENU 카드 -->
  <g>
    <rect x="64" y="1164" width="872" height="220" rx="14" class="f-sheet"/>
    <rect x="64" y="1164" width="872" height="220" rx="14" class="s-green" fill="none" stroke-width="3"/>
    <rect x="73" y="1173" width="854" height="202" rx="9" class="s-green" fill="none" stroke-width="1.2" opacity=".55"/>

    <rect x="90" y="1218" width="170" height="82" rx="10" class="f-green"/>
    <text class="sans f-on-green" x="175" y="1250" font-size="18" text-anchor="middle" letter-spacing="2">TODAY'S</text>
    <text class="sans f-on-green" x="175" y="1278" font-size="21" text-anchor="middle" letter-spacing="2">MENU</text>

    <g id="menu-rows"></g>

    <path d="M682 1192 V1356" class="s-green" stroke-width="1.6" stroke-dasharray="4 6" stroke-linecap="round" opacity=".7"/>
    <g id="noteLines" class="hand f-red" font-size="27"></g>
    <path d="M716 1344 q46 10 96 2" class="s-red" fill="none" stroke-width="3" stroke-linecap="round" opacity=".85"/>
  </g>

  <!-- 하단 : 문구와 도장을 기둥 안에 맞춰 한 덩어리로 -->
  <g>
    <text id="footText" class="sans f-green" x="464" y="1428" font-size="15" text-anchor="middle" letter-spacing="3.4">ALWAYS TOGETHER, ALWAYS HUNGRY</text>
    <g transform="rotate(-10 902 1424)">
      <circle cx="902" cy="1424" r="34" class="s-red" fill="none" stroke-width="2.6"/>
      <circle cx="902" cy="1424" r="29" class="s-red" fill="none" stroke-width="1.2"/>
      <text class="hand f-red" x="902" y="1434" font-size="30" text-anchor="middle">xoxo</text>
    </g>
  </g>

  <!-- 스티커 3종. 옮긴 스티커가 다른 요소 뒤로 숨지 않도록 가장 위에 그린다 -->
  <g class="slot">
    <g id="art-shake" transform="translate(66,470)">
      <path d="M52 42 L36 -8" class="s-red" stroke-width="7" stroke-linecap="round" fill="none"/>
      <path d="M70 42 L88 -4" class="s-red" stroke-width="7" stroke-linecap="round" fill="none"/>
      <circle cx="60" cy="6" r="10" class="f-red"/>
      <path d="M60 -3 Q66 -16 80 -18" class="s-green" fill="none" stroke-width="3" stroke-linecap="round"/>
      <path d="M20 48 C20 30 33 21 44 26 C47 11 68 9 74 22 C89 18 99 31 94 48 Z" class="f-sheet s-red" stroke-width="3"/>
      <g clip-path="url(#clip-shake)">
        <rect x="18" y="46" width="80" height="164" class="f-sheet"/>
        <rect x="20" y="46" width="15" height="164" class="f-red"/>
        <rect x="52" y="46" width="15" height="164" class="f-red"/>
        <rect x="84" y="46" width="15" height="164" class="f-red"/>
        <rect x="18" y="96" width="80" height="60" class="f-sheet"/>
      </g>
      <path d="M18 46 H98 L86 196 Q85 208 74 208 H42 Q31 208 30 196 Z" class="s-red" fill="none" stroke-width="3.4"/>
      <path d="M18 96 H97 M20 156 H95" class="s-red" stroke-width="2" opacity=".5"/>
      <text class="hand f-red" x="58" y="124" font-size="21" text-anchor="middle">Sweet</text>
      <text class="hand f-red" x="58" y="148" font-size="21" text-anchor="middle">&amp; Cool</text>
    </g>
    <image id="img-shake" class="slot-img" preserveAspectRatio="xMidYMid meet"/>
    <rect id="hit-shake" class="slot-hit" fill="none" pointer-events="all"/>
  </g>

  <g class="slot">
    <g id="art-fries" transform="translate(898,584) scale(.68)">
      <g class="f-fry s-food" stroke-width="2.4">
        <rect x="13" y="8" width="14" height="52" rx="4" transform="rotate(-12 20 34)"/>
        <rect x="53" y="8" width="14" height="52" rx="4" transform="rotate(12 60 34)"/>
        <rect x="24" y="14" width="13" height="48" rx="4" transform="rotate(-5 30 38)"/>
        <rect x="45" y="12" width="13" height="50" rx="4" transform="rotate(6 51 37)"/>
        <rect x="34" y="0" width="14" height="62" rx="4"/>
      </g>
      <path d="M2 52 H82 L72 128 q-1 9 -10 9 H22 q-9 0-10-9 Z" fill="url(#pat-check-s)" class="s-red" stroke-width="3.4"/>
      <path d="M2 52 H82" class="s-red" stroke-width="3.4"/>
    </g>
    <image id="img-fries" class="slot-img" preserveAspectRatio="xMidYMid meet"/>
    <rect id="hit-fries" class="slot-hit" fill="none" pointer-events="all"/>
  </g>

  <g class="slot">
    <g id="art-burger" transform="translate(782,566) scale(.85)">
      <ellipse cx="84" cy="158" rx="82" ry="15" class="f-sheet s-red" stroke-width="3"/>
      <g transform="translate(84,100)">
        <path d="M-50 40 H50 C50 51 42 58 31 58 H-31 C-42 58 -50 51 -50 40 Z" class="f-bun s-food" stroke-width="2.8"/>
        <rect x="-53" y="26" width="106" height="18" rx="9" class="f-patty s-food" stroke-width="2.8"/>
        <path d="M-57 12 H57 L52 21 L46 33 L35 21 L25 34 L14 21 L2 33 L-10 21 L-22 34 L-33 21 L-44 33 L-52 21 Z" class="f-cheese s-food" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M-55 -2 C-47 -11 -39 3 -31 -5 C-23 -13 -15 1 -7 -6 C1 -13 9 1 17 -6 C25 -13 33 2 41 -5 C47 -10 53 -6 55 -1 C54 9 46 13 39 9 C31 15 23 8 17 12 C9 17 1 10 -7 13 C-15 16 -23 9 -31 12 C-39 15 -47 9 -55 -2 Z" class="f-lettuce s-food" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M-50 2 C-50 -26 -28 -42 0 -42 C28 -42 50 -26 50 2 Z" class="f-bun s-food" stroke-width="2.8"/>
        <g class="f-sesame">
          <ellipse cx="-30" cy="-16" rx="4.8" ry="2.7" transform="rotate(-30 -30 -16)"/>
          <ellipse cx="-12" cy="-28" rx="4.8" ry="2.7" transform="rotate(-12 -12 -28)"/>
          <ellipse cx="8" cy="-29" rx="4.8" ry="2.7" transform="rotate(10 8 -29)"/>
          <ellipse cx="26" cy="-19" rx="4.8" ry="2.7" transform="rotate(28 26 -19)"/>
          <ellipse cx="-41" cy="-4" rx="4.4" ry="2.5" transform="rotate(-54 -41 -4)"/>
          <ellipse cx="41" cy="-4" rx="4.4" ry="2.5" transform="rotate(54 41 -4)"/>
          <ellipse cx="-2" cy="-14" rx="4.4" ry="2.5" transform="rotate(-6 -2 -14)"/>
          <ellipse cx="18" cy="-8" rx="4.2" ry="2.4" transform="rotate(36 18 -8)"/>

    </div>
  </div>

  <!-- ===================== 편집 패널 ===================== -->
  <div class="panel">
    <header class="brand">
      <h1>Pair<em>frame</em></h1>
      <p>우리 둘을 다이너 메뉴판의 오늘의 스페셜로</p>
    </header>

    <details class="sec" open>
      <summary>간판</summary>
      <div class="body">
        <label class="fld"><span>페어 이름</span>
          <input id="in-pair" type="text" maxlength="18" placeholder="Pairname"></label>
        <div class="grid2">
          <label class="fld"><span>부제</span>
            <input id="in-sub" type="text" maxlength="20" placeholder="DINER &amp; GRILL"></label>
          <label class="fld"><span>설립 연도</span>
            <input id="in-est" type="text" maxlength="6" placeholder="20XX"></label>
        </div>
        <label class="fld"><span>상단 문구</span>
          <input id="in-tag" type="text" maxlength="46" placeholder="GOOD FOOD • GOOD FRIENDS • BETTER DAYS"></label>
      </div>
    </details>

    <details class="sec" open>
      <summary>메인 사진</summary>
      <div class="body">
        <div class="btn-row">
          <button class="btn" id="btn-photo-pick" type="button">사진 올리기</button>
          <button class="btn ghost" id="btn-photo-clear" type="button">지우기</button>
        </div>
        <input id="in-photo" type="file" accept="image/*" hidden>
        <label class="fld range"><span>확대 <b id="lbl-zoom">100%</b></span>
          <input id="in-zoom" type="range" min="100" max="400" step="1" value="100"></label>
        <button class="btn ghost wide" id="btn-photo-reset" type="button">위치·확대 초기화</button>
        <p class="hint">사진을 끌어 위치를 맞추고, 두 손가락 또는 휠로 확대할 수 있어요.
          캐릭터 사진도 같은 방법으로 조정합니다.</p>
      </div>
    </details>

    <details class="sec">
      <summary>캐릭터 01</summary>
      <div class="body" data-char="c1"></div>
    </details>

    <details class="sec">
      <summary>캐릭터 02</summary>
      <div class="body" data-char="c2"></div>
    </details>

    <details class="sec">
      <summary>오늘의 메뉴</summary>
      <div class="body">
        <div class="grid2" id="menu-inputs"></div>
        <label class="fld"><span>오른쪽 메모 (<code>/</code> 로 줄바꿈, 3줄까지)</span>
          <input id="in-note" type="text" maxlength="60" placeholder="Same table / Different worlds / One story"></label>
        <label class="fld"><span>가운데 문구</span>
          <input id="in-always" type="text" maxlength="30" placeholder="ALWAYS TOGETHER"></label>
        <label class="fld"><span>맨 아래 문구</span>
          <input id="in-foot" type="text" maxlength="46" placeholder="ALWAYS TOGETHER, ALWAYS HUNGRY"></label>
      </div>
    </details>

    <details class="sec">
      <summary>스티커 바꾸기</summary>
      <div class="body">
        <p class="hint">배경이 지워진 PNG를 올리면 해당 자리의 일러스트가 교체됩니다.
          올린 뒤에는 포스터 위에서 끌어 옮기고, 슬라이더로 크기를 맞출 수 있어요.</p>
        <div class="stickers" id="sticker-list"></div>
        <input id="in-sticker" type="file" accept="image/*" hidden>
      </div>
    </details>

    <details class="sec">
      <summary>색상</summary>
      <div class="body">
        <div class="presets" id="presets"></div>
        <div class="colors" id="color-list"></div>
        <button class="btn ghost wide" id="btn-color-reset" type="button">색상 초기화</button>
      </div>
    </details>

    <div class="actions">
      <button class="btn primary" id="btn-save" type="button">고화질 PNG로 저장</button>
      <button class="btn ghost small" id="btn-reset-all" type="button">전체 초기화</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
