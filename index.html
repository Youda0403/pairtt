<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pairframe — 페어 프레임 메이커</title>
<meta name="description" content="사진 한 장과 두 사람의 정보로 레트로 다이너 스타일 페어 포스터를 만들고 고화질로 저장하세요.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- ===================== 포스터 ===================== -->
  <div class="stage">
    <div class="stage-inner">
<svg id="poster" viewBox="0 0 1000 1500" preserveAspectRatio="xMidYMid meet" role="img" aria-label="페어 포스터 미리보기">

  <defs>
    <!-- 색상 + 폰트는 JS가 여기에 주입한다 (저장 시 그대로 직렬화됨) -->
    <style id="theme-style"></style>

    <!-- 재사용 아이콘. 모두 fill 전용이라 use 한 번으로 색이 통일된다 -->
    <g id="ic-heart"><path d="M0 4.6C-7.4-2.2-3.7-10 0-5.6 3.7-10 7.4-2.2 0 4.6Z"/></g>
    <g id="ic-star"><path d="M0-10 2.9-3.4 10-2.7 4.6 2.1 6.2 9.2 0 5.4-6.2 9.2-4.6 2.1-10-2.7-2.9-3.4Z"/></g>
    <g id="ic-spark"><path d="M0-10C1.3-4 4-1.3 10 0 4 1.3 1.3 4 0 10-1.3 4-4 1.3-10 0-4-1.3-1.3-4 0-10Z"/></g>
    <g id="ic-note">
      <rect x="-7.4" y="-16" width="2.8" height="20" rx="1.2"/>
      <rect x="5.8" y="-19.6" width="2.8" height="20" rx="1.2"/>
      <path d="M-7.4-16 8.6-19.8V-14.6L-7.4-10.8Z"/>
      <ellipse cx="-9.6" cy="4.2" rx="5" ry="3.8" transform="rotate(-20 -9.6 4.2)"/>
      <ellipse cx="3.6" cy="0.6" rx="5" ry="3.8" transform="rotate(-20 3.6 .6)"/>
    </g>

    <!-- 체크무늬 (테두리 밴드) -->
    <pattern id="pat-check" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" class="f-paper"/>
      <rect width="20" height="20" class="f-red"/>
      <rect x="20" y="20" width="20" height="20" class="f-red"/>
    </pattern>
    <!-- 작은 체크무늬 (감자튀김 봉투) -->
    <pattern id="pat-check-s" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" class="f-paper"/>
      <rect width="9" height="9" class="f-red"/>
      <rect x="9" y="9" width="9" height="9" class="f-red"/>
    </pattern>
    <!-- 깅엄 (마스킹테이프) -->
    <pattern id="pat-g1" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" class="f-p1" fill-opacity=".16"/>
      <rect width="8" height="8" class="f-p1" fill-opacity=".55"/>
      <rect x="8" y="8" width="8" height="8" class="f-p1" fill-opacity=".55"/>
    </pattern>

    <!-- 종이 질감 -->
    <pattern id="pat-grain" width="140" height="140" patternUnits="userSpaceOnUse">
      <g class="f-grain">
        <circle cx="12" cy="23" r="1.3"/><circle cx="58" cy="9" r="1"/><circle cx="97" cy="31" r="1.4"/>
        <circle cx="131" cy="17" r="1"/><circle cx="34" cy="54" r="1.1"/><circle cx="76" cy="63" r="1.5"/>
        <circle cx="118" cy="58" r="1"/><circle cx="7" cy="82" r="1.2"/><circle cx="49" cy="95" r="1"/>
        <circle cx="88" cy="88" r="1.3"/><circle cx="127" cy="101" r="1.1"/><circle cx="21" cy="118" r="1.4"/>
        <circle cx="63" cy="129" r="1"/><circle cx="104" cy="124" r="1.2"/><circle cx="137" cy="136" r="1"/>
        <circle cx="44" cy="7" r="1"/><circle cx="83" cy="44" r="1"/><circle cx="15" cy="65" r="1"/>
      </g>
    </pattern>

    <radialGradient id="grad-vig" cx="50%" cy="46%" r="72%">
      <stop offset="55%" stop-color="#8a6034" stop-opacity="0"/>
      <stop offset="100%" stop-color="#8a6034" stop-opacity=".17"/>
    </radialGradient>

    <clipPath id="clip-photo"><rect x="170" y="278" width="660" height="590" rx="14"/></clipPath>
  </defs>

  <!-- 배경 -->
  <rect width="1000" height="1500" class="f-paper"/>
  <rect width="1000" height="1500" fill="url(#pat-grain)"/>
  <rect width="1000" height="1500" fill="url(#grad-vig)"/>

  <!-- 상하 체크 밴드 -->
  <rect x="0" y="0" width="1000" height="40" fill="url(#pat-check)"/>
  <rect x="0" y="1460" width="1000" height="40" fill="url(#pat-check)"/>

  <!-- 좌상단 스탬프 -->

    <text class="sans f-red" x="95" y="96" font-size="13" text-anchor="middle" letter-spacing=".8">GOOD</text>
    <text class="sans f-red" x="95" y="111" font-size="13" text-anchor="middle" letter-spacing=".8">FOOD</text>

      <image id="photoImg" preserveAspectRatio="none" style="display:none"/>
    </g>

    <text class="sans f-sheet" x="96" y="973" font-size="16" letter-spacing="2.4">CREW MEMBER</text>

  <!-- ===================== 편집 패널 ===================== -->
  <div class="panel">
    <header class="brand">
      <h1>Pair<em>frame</em></h1>
      <p>사진 한 장으로 만드는 우리 둘의 포스터</p>
    </header>

    <details class="sec" open>
      <summary>제목 &amp; 이름</summary>
      <div class="body">
        <label class="fld"><span>페어 이름</span>
          <input id="in-pair" type="text" maxlength="16" placeholder="Pairname"></label>
        <label class="fld"><span>캐릭터 1 이름</span>
          <input id="in-c1-name" type="text" maxlength="14" placeholder="character 1"></label>
        <label class="fld"><span>캐릭터 2 이름</span>
          <input id="in-c2-name" type="text" maxlength="14" placeholder="character 2"></label>
      </div>
    </details>

    <details class="sec" open>
      <summary>메인 사진</summary>
      <div class="body">
        <div class="btn-row">
          <button class="btn" id="btn-photo-pick" type="button">사진 올리기</button>
          <button class="btn ghost" id="btn-photo-clear" type="button">지우기</button>
        </div>
        <input id="in-photo" type="file" accept="image/*" hidden>
        <label class="fld range"><span>확대 <b id="lbl-zoom">100%</b></span>
          <input id="in-zoom" type="range" min="100" max="400" step="1" value="100"></label>
        <div class="btn-row">
          <button class="btn ghost" id="btn-photo-reset" type="button">위치·확대 초기화</button>
        </div>
        <p class="hint">사진을 손가락(마우스)으로 끌어 위치를 맞추고, 두 손가락 또는 휠로 확대할 수 있어요.</p>
      </div>
    </details>

    <details class="sec">
      <summary>캐릭터 1</summary>
      <div class="body">
        <label class="fld"><span>나이 (Age)</span>
          <input id="in-c1-age" type="text" maxlength="12" placeholder="28"></label>
        <label class="fld"><span>직업 (Job)</span>
          <input id="in-c1-job" type="text" maxlength="18" placeholder="Designer"></label>
        <div class="fld">
          <span>Like / Dislike</span>
          <div class="toggle" id="tg-c1">
            <button type="button" data-v="LIKE" class="on">LIKE</button>
            <button type="button" data-v="DISLIKE">DISLIKE</button>
          </div>
          <p class="hint">값은 캐릭터 2의 이름이 자동으로 들어갑니다.</p>
        </div>
      </div>
    </details>

    <details class="sec">
      <summary>캐릭터 2</summary>
      <div class="body">
        <label class="fld"><span>나이 (Age)</span>
          <input id="in-c2-age" type="text" maxlength="12" placeholder="30"></label>
        <label class="fld"><span>직업 (Job)</span>
          <input id="in-c2-job" type="text" maxlength="18" placeholder="Barista"></label>
        <div class="fld">
          <span>Like / Dislike</span>
          <div class="toggle" id="tg-c2">
            <button type="button" data-v="LIKE" class="on">LIKE</button>
            <button type="button" data-v="DISLIKE">DISLIKE</button>
          </div>
          <p class="hint">값은 캐릭터 1의 이름이 자동으로 들어갑니다.</p>
        </div>
      </div>
    </details>

    <details class="sec">
      <summary>스티커 바꾸기</summary>
      <div class="body">
        <p class="hint">배경이 지워진 PNG를 올리면 해당 자리의 일러스트가 교체됩니다.</p>
        <div class="stickers" id="sticker-list"></div>
        <input id="in-sticker" type="file" accept="image/*" hidden>
      </div>
    </details>

    <details class="sec">
      <summary>색상</summary>
      <div class="body">
        <div class="presets" id="presets"></div>
        <div class="colors" id="color-list"></div>
        <button class="btn ghost" id="btn-color-reset" type="button">색상 초기화</button>
      </div>
    </details>

    <div class="actions">
      <button class="btn primary" id="btn-save" type="button">고화질 PNG로 저장</button>
      <button class="btn ghost small" id="btn-reset-all" type="button">전체 초기화</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
</body>
