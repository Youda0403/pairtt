<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pairframe — 페어 프레임 메이커</title>
<meta name="description" content="사진 한 장과 두 사람의 정보로 레트로 다이너 스타일 페어 포스터를 만들고 고화질로 저장하세요.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- ===================== 포스터 ===================== -->
  <div class="stage">
    <div class="stage-inner">
<svg id="poster" viewBox="0 0 1000 1500" preserveAspectRatio="xMidYMid meet" role="img" aria-label="페어 포스터 미리보기">

  <defs>
    <!-- 색상 + 폰트는 JS가 여기에 주입한다 (저장 시 그대로 직렬화됨) -->
    <style id="theme-style"></style>

    <!-- 재사용 아이콘. 모두 fill 전용이라 use 한 번으로 색이 통일된다 -->
    <g id="ic-heart"><path d="M0 6.6C-1.4 5.4-7.6 1-7.6-2.8-7.6-5.9-5.1-7.7-2.8-7.7-1.2-7.7-.3-6.8 0-5.9 .3-6.8 1.2-7.7 2.8-7.7 5.1-7.7 7.6-5.9 7.6-2.8 7.6 1 1.4 5.4 0 6.6Z"/></g>
    <g id="ic-star"><path d="M0-10 2.9-3.4 10-2.7 4.6 2.1 6.2 9.2 0 5.4-6.2 9.2-4.6 2.1-10-2.7-2.9-3.4Z"/></g>

    <!-- 도장 글씨가 따라 흐르는 원호 -->
    <path id="stamp-top" d="M61 112 A34 34 0 0 1 129 112" fill="none"/>
    <path id="stamp-bot" d="M49 112 A46 46 0 0 0 141 112" fill="none"/>

    <filter id="lift" x="-12%" y="-12%" width="128%" height="128%">
      <feDropShadow dx="3" dy="7" stdDeviation="7" flood-color="#4a2f18" flood-opacity=".26"/>
    </filter>
    <filter id="lift-sm" x="-14%" y="-14%" width="132%" height="132%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#4a2f18" flood-opacity=".22"/>
    </filter>

    <!-- 체크무늬 (테두리 밴드) -->
    <pattern id="pat-check" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" class="f-paper"/>
      <rect width="20" height="20" class="f-red"/>
      <rect x="20" y="20" width="20" height="20" class="f-red"/>
    </pattern>
    <!-- 작은 체크무늬 (감자튀김 봉투) -->
    <pattern id="pat-check-s" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" class="f-paper"/>
      <rect width="9" height="9" class="f-red"/>
      <rect x="9" y="9" width="9" height="9" class="f-red"/>
    </pattern>
    <!-- 깅엄 (마스킹테이프) -->
    <pattern id="pat-g1" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" class="f-p1" fill-opacity=".16"/>
      <rect width="8" height="8" class="f-p1" fill-opacity=".55"/>
      <rect x="8" y="8" width="8" height="8" class="f-p1" fill-opacity=".55"/>
    </pattern>

    <!-- 종이 질감 -->
    <pattern id="pat-grain" width="140" height="140" patternUnits="userSpaceOnUse">
      <g class="f-grain">
        <circle cx="12" cy="23" r="1.3"/><circle cx="58" cy="9" r="1"/><circle cx="97" cy="31" r="1.4"/>
        <circle cx="131" cy="17" r="1"/><circle cx="34" cy="54" r="1.1"/><circle cx="76" cy="63" r="1.5"/>
        <circle cx="118" cy="58" r="1"/><circle cx="7" cy="82" r="1.2"/><circle cx="49" cy="95" r="1"/>
        <circle cx="88" cy="88" r="1.3"/><circle cx="127" cy="101" r="1.1"/><circle cx="21" cy="118" r="1.4"/>
        <circle cx="63" cy="129" r="1"/><circle cx="104" cy="124" r="1.2"/><circle cx="137" cy="136" r="1"/>
        <circle cx="44" cy="7" r="1"/><circle cx="83" cy="44" r="1"/><circle cx="15" cy="65" r="1"/>
      </g>
    </pattern>

    <radialGradient id="grad-vig" cx="50%" cy="46%" r="72%">
      <stop offset="55%" stop-color="#8a6034" stop-opacity="0"/>
      <stop offset="100%" stop-color="#8a6034" stop-opacity=".17"/>
    </radialGradient>

    <clipPath id="clip-photo"><rect x="170" y="278" width="660" height="590" rx="14"/></clipPath>
  </defs>

  <!-- 배경 -->
  <rect width="1000" height="1500" class="f-paper"/>
  <rect width="1000" height="1500" fill="url(#pat-grain)"/>
  <rect width="1000" height="1500" fill="url(#grad-vig)"/>

  <!-- 상하 체크 밴드 -->
  <rect x="0" y="0" width="1000" height="40" fill="url(#pat-check)"/>
  <rect x="0" y="1460" width="1000" height="40" fill="url(#pat-check)"/>

  <!-- 좌상단 고무도장 -->
  <g transform="rotate(-7 95 112)">
    <circle cx="95" cy="112" r="50" class="s-red" fill="none" stroke-width="3.4"/>
    <circle cx="95" cy="112" r="45" class="s-red" fill="none" stroke-width="1.2"/>
    <circle cx="95" cy="112" r="31" class="s-red" fill="none" stroke-width="1.6"/>
    <text class="sans f-red" font-size="13" letter-spacing="1.8">
      <textPath href="#stamp-top" startOffset="50%" text-anchor="middle">GOOD FOOD</textPath>
    </text>
    <text class="sans f-red" font-size="13" letter-spacing="1.8">
      <textPath href="#stamp-bot" startOffset="50%" text-anchor="middle">GOOD COMPANY</textPath>
    </text>
    <path d="M50 112 l4.5-5.5 4.5 5.5 -4.5 5.5 z" class="f-red"/>
    <path d="M131 112 l4.5-5.5 4.5 5.5 -4.5 5.5 z" class="f-red"/>
    <g transform="translate(95,113)">
      <path d="M-15-4 C-15-12 -8-17 0-17 C8-17 15-12 15-4 Z" class="f-red"/>
      <path d="M-16 0 H16" class="s-red" stroke-width="2.6" stroke-linecap="round"/>
      <rect x="-14" y="4" width="28" height="5" rx="2.5" class="f-red"/>
      <path d="M-15 12 H15 C15 16 12 18 9 18 H-9 C-12 18 -15 16 -15 12 Z" class="f-red"/>
    </g>
  </g>

  <!-- 우상단 로제트 씰 (왼쪽 도장과 짝을 이루는 장식) -->
  <g transform="rotate(7 905 112)">
    <path class="f-red" d="M886 148 L876 194 L897 182 L908 198 L916 150 Z"/>
    <g class="f-red"><circle cx="948.0" cy="112.0" r="7.5"/><circle cx="945.4" cy="126.7" r="7.5"/><circle cx="937.9" cy="139.6" r="7.5"/><circle cx="926.5" cy="149.2" r="7.5"/><circle cx="912.5" cy="154.3" r="7.5"/><circle cx="897.5" cy="154.3" r="7.5"/><circle cx="883.5" cy="149.2" r="7.5"/><circle cx="872.1" cy="139.6" r="7.5"/><circle cx="864.6" cy="126.7" r="7.5"/><circle cx="862.0" cy="112.0" r="7.5"/><circle cx="864.6" cy="97.3" r="7.5"/><circle cx="872.1" cy="84.4" r="7.5"/><circle cx="883.5" cy="74.8" r="7.5"/><circle cx="897.5" cy="69.7" r="7.5"/><circle cx="912.5" cy="69.7" r="7.5"/><circle cx="926.5" cy="74.8" r="7.5"/><circle cx="937.9" cy="84.4" r="7.5"/><circle cx="945.4" cy="97.3" r="7.5"/></g>
    <circle cx="905" cy="112" r="43" class="f-paper"/>
    <circle cx="905" cy="112" r="42" class="s-red" fill="none" stroke-width="3"/>
    <circle cx="905" cy="112" r="33" class="s-red" fill="none" stroke-width="1.4"/>
    <use href="#ic-star" class="f-red" transform="translate(905,101) scale(2)"/>
    <use href="#ic-heart" class="f-red" transform="translate(905,130) scale(1)"/>
  </g>

  <!-- Pairname : 부제를 없애고 이 자리의 주인공으로 키웠다 (중앙 500 기준) -->
  <g>
    <text id="pairShadow" class="disp f-deep s-deep" x="507" y="225" font-size="140" text-anchor="middle"
          paint-order="stroke" stroke-width="14" stroke-linejoin="round">Pairname</text>
    <text id="pairName" class="disp f-red s-paper" x="500" y="218" font-size="140" text-anchor="middle"
          paint-order="stroke" stroke-width="15" stroke-linejoin="round">Pairname</text>
    <use id="titleHeart" href="#ic-heart" class="f-red s-paper" stroke-width="5" paint-order="stroke"
         transform="translate(164,192) rotate(-14) scale(2.4)"/>
    <use id="pairStar" href="#ic-star" class="f-red s-paper" stroke-width="5" paint-order="stroke"
         transform="translate(836,192) rotate(-12) scale(2.4)"/>
  </g>

  <!-- 사진 프레임 (중앙 500 기준) -->
  <g id="photoBlock">
    <rect x="160" y="268" width="680" height="610" rx="22" class="s-red" fill="none" stroke-width="2"/>
    <rect x="170" y="278" width="660" height="590" rx="14" class="f-green"/>
    <g clip-path="url(#clip-photo)">
      <image id="photoImg" preserveAspectRatio="none" style="display:none"/>
    </g>
    <g id="photoHint">
      <g class="s-green-ink" fill="none" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="462" y="500" width="76" height="62" rx="9"/>
        <circle cx="483" cy="520" r="5.5"/>
        <path d="M467 554 l21-23 15 15 11-11 19 17"/>
        <path d="M436 510 l-15-9 M434 536 l-17 3 M444 558 l-14 11 M564 510 l15-9 M566 536 l17 3 M556 558 l14 11"/>
      </g>
      <text class="hand f-green-ink" x="500" y="610" font-size="38" text-anchor="middle">photo here!</text>
      <use href="#ic-heart" class="f-green-ink" transform="translate(500,632) scale(1.2)"/>
    </g>
    <rect x="170" y="278" width="660" height="590" rx="14" class="s-red" fill="none" stroke-width="5"/>
    <rect id="photoHit" x="170" y="278" width="660" height="590" rx="14" fill="none" pointer-events="all"/>
    <g transform="rotate(-28 192 338)">
      <rect x="124" y="319" width="138" height="38" fill="url(#pat-g1)" opacity=".9"/>
      <rect x="124" y="319" width="138" height="38" class="s-p1" fill="none" stroke-width="1.2" opacity=".5"/>
    </g>
  </g>

  <!-- 영수증 : 왼쪽으로 흘려보내 잘리게 두고, 종이색을 채워 실물처럼 -->
  <g transform="rotate(-2.5 72 514)">
    <path class="f-sheet" filter="url(#lift-sm)"
          d="M-16 376 l11 -7 l11 7 l11 -7 l11 7 l11 -7 l11 7 l11 -7 l11 7 l11 -7 l11 7 l11 -7 l11 7 l11 -7 l11 7 l11 -7 l11 7 V652 l-11 7 l-11 -7 l-11 7 l-11 -7 l-11 7 l-11 -7 l-11 7 l-11 -7 l-11 7 l-11 -7 l-11 7 l-11 -7 l-11 7 l-11 -7 l-11 7 l-11 -7 Z"/>
    <text class="sans f-red" x="6" y="424" font-size="16" letter-spacing=".5">TODAY'S MENU</text>
    <path d="M4 434 H134" class="s-red" stroke-width="1.8"/>
    <g class="sans f-red" font-size="12" letter-spacing="1">
      <text x="6" y="460">LOVE</text><path d="M50 456 H114" class="s-red" stroke-width="1.6" stroke-dasharray="1.5 5"/><text x="134" y="460" text-anchor="end">1</text>
      <text x="6" y="488">LAUGHTER</text><path d="M82 484 H114" class="s-red" stroke-width="1.6" stroke-dasharray="1.5 5"/><text x="134" y="488" text-anchor="end">1</text>
      <text x="6" y="516">GOOD FOOD</text><path d="M90 512 H114" class="s-red" stroke-width="1.6" stroke-dasharray="1.5 5"/><text x="134" y="516" text-anchor="end">1</text>
      <text x="6" y="544">YOU &amp; ME</text><path d="M80 540 H104" class="s-red" stroke-width="1.6" stroke-dasharray="1.5 5"/>
    </g>
    <g class="s-red" fill="none" stroke-width="2.2" transform="translate(122,540)">
      <circle cx="-4.6" cy="0" r="4.4"/><circle cx="4.6" cy="0" r="4.4"/>
    </g>
    <path d="M4 566 H134" class="s-red" stroke-width="1.2" opacity=".45" stroke-dasharray="4 4"/>
    <ellipse cx="62" cy="604" rx="56" ry="22" class="s-p1" fill="none" stroke-width="2" transform="rotate(-5 62 604)"/>
    <text class="hand f-p1" x="58" y="612" font-size="23" text-anchor="middle" transform="rotate(-5 58 612)">Best Choice!</text>
    <use href="#ic-heart" class="f-p1" transform="translate(114,598) rotate(12) scale(1)"/>
  </g>

  <!-- Good Food = Good Mood -->
  <g class="hand f-red" font-size="36" text-anchor="middle">
    <text x="915" y="486">Good</text>
    <text x="915" y="522">Food</text>
    <text x="915" y="558">=</text>
    <text x="915" y="594">Good</text>
    <text x="915" y="630">Mood</text>
  </g>
  <g class="s-red" fill="none" stroke-width="2.6" transform="translate(915,658) rotate(-8)">
    <circle cx="0" cy="0" r="12"/>
    <circle cx="-4.5" cy="-3" r="1.4" class="f-red"/>
    <circle cx="4.5" cy="-3" r="1.4" class="f-red"/>
    <path d="M-6 3 q6 7 12 0"/>
  </g>

  <!-- 사원증 1 (왼쪽) : 사진 프레임 아래를 살짝 덮으며 얹힌다 -->
  <g transform="rotate(-1.8 258 1076)">
    <g filter="url(#lift)">
      <rect x="38" y="842" width="440" height="468" rx="20" class="f-sheet"/>
    </g>
    <rect x="38" y="842" width="440" height="468" rx="20" class="s-p1" fill="none" stroke-width="3"/>
    <rect x="225" y="864" width="66" height="14" rx="7" class="s-p1" fill="none" stroke-width="2.6"/>

    <rect x="54" y="894" width="408" height="48" rx="10" class="f-p1"/>
    <use href="#ic-star" class="f-on-p1" transform="translate(76,918) rotate(-10) scale(1.15)"/>
    <text class="sans f-on-p1" x="96" y="924" font-size="16" letter-spacing="2.4">CREW MEMBER</text>
    <text class="sans f-on-p1" x="446" y="924" font-size="14" text-anchor="end" letter-spacing="1">No.01</text>

    <rect x="133" y="960" width="250" height="56" rx="28" class="s-p1" fill="none" stroke-width="2.6"/>
    <text id="c1Name" class="hand f-p1" x="258" y="999" font-size="32" text-anchor="middle">character 1</text>

    <g id="row-1a"><text class="sans lbl f-p1" x="84" y="1076">AGE</text><text class="sans lbl f-p1 colon" y="1076">:</text><path class="dash s-p1"/><text class="hand val f-p1" y="1070"></text></g>
    <g id="row-1j"><text class="sans lbl f-p1" x="84" y="1128">JOB</text><text class="sans lbl f-p1 colon" y="1128">:</text><path class="dash s-p1"/><text class="hand val f-p1" y="1122"></text></g>
    <g id="row-1l"><text class="sans lbl f-p1" x="84" y="1180">LIKE</text><text class="sans lbl f-p1 colon" y="1180">:</text><path class="dash s-p1"/><text class="hand val f-p1" y="1174"></text></g>

    <g class="f-p1"><rect x="84" y="1224" width="3.2" height="34" rx=".6"/><rect x="90.4" y="1224" width="3.2" height="34" rx=".6"/><rect x="96.2" y="1224" width="4.4" height="34" rx=".6"/><rect x="103.8" y="1224" width="1.6" height="34" rx=".6"/><rect x="107.4" y="1224" width="4.4" height="34" rx=".6"/><rect x="114.4" y="1224" width="4.4" height="34" rx=".6"/><rect x="120.8" y="1224" width="1.6" height="34" rx=".6"/><rect x="125" y="1224" width="2.4" height="34" rx=".6"/><rect x="129.4" y="1224" width="1.6" height="34" rx=".6"/><rect x="134.2" y="1224" width="1.6" height="34" rx=".6"/><rect x="139" y="1224" width="3.2" height="34" rx=".6"/><rect x="144.8" y="1224" width="4.4" height="34" rx=".6"/><rect x="152.4" y="1224" width="1.6" height="34" rx=".6"/><rect x="157.2" y="1224" width="1.6" height="34" rx=".6"/><rect x="162" y="1224" width="1.6" height="34" rx=".6"/><rect x="165.6" y="1224" width="1.6" height="34" rx=".6"/><rect x="169.2" y="1224" width="1.6" height="34" rx=".6"/><rect x="174" y="1224" width="1.6" height="34" rx=".6"/><rect x="178.2" y="1224" width="2.4" height="34" rx=".6"/><rect x="183.2" y="1224" width="4.4" height="34" rx=".6"/><rect x="189.6" y="1224" width="4.4" height="34" rx=".6"/><rect x="196" y="1224" width="2.4" height="34" rx=".6"/><rect x="201" y="1224" width="1.6" height="34" rx=".6"/><rect x="205.8" y="1224" width="1.6" height="34" rx=".6"/><rect x="210" y="1224" width="2.4" height="34" rx=".6"/><rect x="215" y="1224" width="4.4" height="34" rx=".6"/><rect x="221.4" y="1224" width="2.4" height="34" rx=".6"/><rect x="226.4" y="1224" width="1.6" height="34" rx=".6"/><rect x="231.2" y="1224" width="2.4" height="34" rx=".6"/></g>
    <text class="sans f-p1" x="432" y="1254" font-size="14" text-anchor="end" letter-spacing="1.4">ID 0001</text>

    <use href="#ic-heart" class="f-p1" transform="translate(414,1160) rotate(14) scale(2.4)" fill-opacity=".28"/>
  </g>

  <!-- 사원증 2 (오른쪽) -->
  <g transform="rotate(1.8 742 1076)">
    <g filter="url(#lift)">
      <rect x="522" y="842" width="440" height="468" rx="20" class="f-sheet"/>
    </g>
    <rect x="522" y="842" width="440" height="468" rx="20" class="s-p2" fill="none" stroke-width="3"/>
    <rect x="709" y="864" width="66" height="14" rx="7" class="s-p2" fill="none" stroke-width="2.6"/>

    <rect x="538" y="894" width="408" height="48" rx="10" class="f-p2"/>
    <use href="#ic-star" class="f-on-p2" transform="translate(560,918) rotate(10) scale(1.15)"/>
    <text class="sans f-on-p2" x="580" y="924" font-size="16" letter-spacing="2.4">CREW MEMBER</text>
    <text class="sans f-on-p2" x="930" y="924" font-size="14" text-anchor="end" letter-spacing="1">No.02</text>

    <rect x="617" y="960" width="250" height="56" rx="28" class="s-p2" fill="none" stroke-width="2.6"/>
    <text id="c2Name" class="hand f-p2" x="742" y="999" font-size="32" text-anchor="middle">character 2</text>

    <g id="row-2a"><text class="sans lbl f-p2" x="568" y="1076">AGE</text><text class="sans lbl f-p2 colon" y="1076">:</text><path class="dash s-p2"/><text class="hand val f-p2" y="1070"></text></g>

  <!-- ===================== 편집 패널 ===================== -->
  <div class="panel">
    <header class="brand">
      <h1>Pair<em>frame</em></h1>
      <p>사진 한 장으로 만드는 우리 둘의 포스터</p>
    </header>

    <details class="sec" open>
      <summary>제목 &amp; 이름</summary>
      <div class="body">
        <label class="fld"><span>페어 이름</span>
          <input id="in-pair" type="text" maxlength="16" placeholder="Pairname"></label>
        <label class="fld"><span>캐릭터 1 이름</span>
          <input id="in-c1-name" type="text" maxlength="14" placeholder="character 1"></label>
        <label class="fld"><span>캐릭터 2 이름</span>
          <input id="in-c2-name" type="text" maxlength="14" placeholder="character 2"></label>
      </div>
    </details>

    <details class="sec" open>
      <summary>메인 사진</summary>
      <div class="body">
        <div class="btn-row">
          <button class="btn" id="btn-photo-pick" type="button">사진 올리기</button>
          <button class="btn ghost" id="btn-photo-clear" type="button">지우기</button>
        </div>
        <input id="in-photo" type="file" accept="image/*" hidden>
        <label class="fld range"><span>확대 <b id="lbl-zoom">100%</b></span>
          <input id="in-zoom" type="range" min="100" max="400" step="1" value="100"></label>
        <div class="btn-row">
          <button class="btn ghost" id="btn-photo-reset" type="button">위치·확대 초기화</button>
        </div>
        <p class="hint">사진을 손가락(마우스)으로 끌어 위치를 맞추고, 두 손가락 또는 휠로 확대할 수 있어요.</p>
      </div>
    </details>

    <details class="sec">
      <summary>캐릭터 1</summary>
      <div class="body">
        <label class="fld"><span>나이 (Age)</span>
          <input id="in-c1-age" type="text" maxlength="12" placeholder="28"></label>
        <label class="fld"><span>직업 (Job)</span>
          <input id="in-c1-job" type="text" maxlength="18" placeholder="Designer"></label>
        <div class="fld">
          <span>Like / Dislike</span>
          <div class="toggle" id="tg-c1">
            <button type="button" data-v="LIKE" class="on">LIKE</button>
            <button type="button" data-v="DISLIKE">DISLIKE</button>
          </div>
          <p class="hint">값은 캐릭터 2의 이름이 자동으로 들어갑니다.</p>
        </div>
      </div>
    </details>

    <details class="sec">
      <summary>캐릭터 2</summary>
      <div class="body">
        <label class="fld"><span>나이 (Age)</span>
          <input id="in-c2-age" type="text" maxlength="12" placeholder="30"></label>
        <label class="fld"><span>직업 (Job)</span>
          <input id="in-c2-job" type="text" maxlength="18" placeholder="Barista"></label>
        <div class="fld">
          <span>Like / Dislike</span>
          <div class="toggle" id="tg-c2">
            <button type="button" data-v="LIKE" class="on">LIKE</button>
            <button type="button" data-v="DISLIKE">DISLIKE</button>
          </div>
          <p class="hint">값은 캐릭터 1의 이름이 자동으로 들어갑니다.</p>
        </div>
      </div>
    </details>

    <details class="sec">
      <summary>스티커 바꾸기</summary>
      <div class="body">
        <p class="hint">배경이 지워진 PNG를 올리면 해당 자리의 일러스트가 교체됩니다.
          올린 뒤에는 포스터 위에서 끌어 옮기고, 아래 슬라이더로 크기를 맞출 수 있어요.</p>
        <div class="stickers" id="sticker-list"></div>
        <input id="in-sticker" type="file" accept="image/*" hidden>
      </div>
    </details>

    <details class="sec">
      <summary>색상</summary>
      <div class="body">
        <div class="presets" id="presets"></div>
        <div class="colors" id="color-list"></div>
        <button class="btn ghost" id="btn-color-reset" type="button">색상 초기화</button>
      </div>
    </details>

    <div class="actions">
      <button class="btn primary" id="btn-save" type="button">고화질 PNG로 저장</button>
      <button class="btn ghost small" id="btn-reset-all" type="button">전체 초기화</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
</body>
