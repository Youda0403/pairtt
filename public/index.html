<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<title>chat</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>💬</text></svg>">
<style>
  :root {
    --bg: #12100e;
    --bg-raised: #1b1815;
    --line: #2e2925;
    --text: #eae5df;
    --text-dim: #97908a;
    --accent: #d4a373;
    --accent-ink: #1a1512;
    --user-bg: #2b2521;
    --danger: #e08a7a;
    --radius: 16px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #faf7f3; --bg-raised: #ffffff; --line: #e6ded4;
      --text: #221e1a; --text-dim: #7c736a; --accent: #a9713a;
      --accent-ink: #ffffff; --user-bg: #efe6da;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo",
          "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  textarea, input { font: inherit; color: inherit; }

  /* ── 레이아웃 ─────────────────────────────────────────── */
  #app { display: none; flex-direction: column; height: 100dvh; }
  #app.on { display: flex; }

  header {
    display: flex; align-items: center; gap: 10px;
    padding: max(env(safe-area-inset-top), 10px) 14px 10px;
    border-bottom: 1px solid var(--line);
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(12px);
    position: sticky; top: 0; z-index: 5;
  }
  header .spacer { flex: 1; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 11px;
    display: grid; place-items: center; color: var(--text-dim);
  }
  .icon-btn:hover, .icon-btn:active { background: var(--bg-raised); color: var(--text); }
  .icon-btn svg { width: 20px; height: 20px; }

  #modelBtn {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 12px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--bg-raised);
    font-size: 13px; font-weight: 600; letter-spacing: -0.01em;
  }
  #modelBtn .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

  #scroller { flex: 1; overflow-y: auto; overscroll-behavior-y: contain; -webkit-overflow-scrolling: touch; }
  #thread { max-width: 760px; margin: 0 auto; padding: 18px 14px 8px; display: flex; flex-direction: column; gap: 18px; }

  .msg { display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 86%; word-break: break-word; }
  .msg.user .bubble {
    background: var(--user-bg); padding: 11px 15px;
    border-radius: var(--radius) var(--radius) 5px var(--radius);
    white-space: pre-wrap;
  }
  .msg.assistant .bubble { max-width: 100%; }

  /* 마크다운 */
  .bubble p { margin: 0 0 0.85em; }
  .bubble > :last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 0 0 0.85em; padding-left: 1.3em; }
  .bubble li { margin: 0.2em 0; }
  .bubble code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.88em;
    background: var(--bg-raised); border: 1px solid var(--line);
    padding: 0.1em 0.38em; border-radius: 6px;
  }
  .bubble pre {
    background: var(--bg-raised); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px; overflow-x: auto; margin: 0 0 0.85em;
  }
  .bubble pre code { background: none; border: 0; padding: 0; font-size: 0.85em; }
  .bubble a { color: var(--accent); }
  .bubble h1, .bubble h2, .bubble h3 { font-size: 1.05em; margin: 1.2em 0 0.5em; }
  .bubble hr { border: 0; border-top: 1px solid var(--line); margin: 1.2em 0; }
  .bubble blockquote {
    margin: 0 0 0.85em; padding-left: 12px;
    border-left: 2px solid var(--line); color: var(--text-dim);
  }

  .cursor {
    display: inline-block; width: 7px; height: 1.05em; vertical-align: -0.18em;
    background: var(--accent); border-radius: 2px; animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .notice { text-align: center; font-size: 13px; color: var(--text-dim); padding: 4px 0; }
  .notice.err { color: var(--danger); }
  #loadMore {
    align-self: center; font-size: 13px; color: var(--text-dim);
    padding: 6px 14px; border: 1px solid var(--line); border-radius: 999px;
  }
  #empty { text-align: center; color: var(--text-dim); font-size: 14px; padding: 22vh 20px; line-height: 1.9; }

  /* ── 입력창 ───────────────────────────────────────────── */
  #composer {
    border-top: 1px solid var(--line); background: var(--bg);
    padding: 10px 14px calc(env(safe-area-inset-bottom) + 10px);
  }
  #composerInner {
    max-width: 760px; margin: 0 auto;
    display: flex; align-items: flex-end; gap: 8px;
    background: var(--bg-raised); border: 1px solid var(--line);
    border-radius: 22px; padding: 6px 6px 6px 16px;
  }
  #composerInner:focus-within { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
  #input {
    flex: 1; border: 0; background: none; resize: none; outline: none;
    max-height: 40dvh; padding: 8px 0; line-height: 1.55;
  }
  #send {
    width: 36px; height: 36px; flex: none; border-radius: 50%;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; transition: opacity .15s;
  }
  #send[disabled] { opacity: 0.3; cursor: default; }
  #send svg { width: 18px; height: 18px; }

  /* ── 모달 / 로그인 ────────────────────────────────────── */
  .sheet {
    position: fixed; inset: 0; z-index: 50; display: none;
    background: color-mix(in srgb, #000 55%, transparent);
    backdrop-filter: blur(3px);
    align-items: center; justify-content: center; padding: 16px;
  }
  .sheet.on { display: flex; }
  .card {
    background: var(--bg); border: 1px solid var(--line); border-radius: 20px;
    width: 100%; max-width: 620px; max-height: 88dvh;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .card h2 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
  .card-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
  .card-head .spacer { flex: 1; }
  .card-body { padding: 18px; overflow-y: auto; }
  .card-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 14px 18px; border-top: 1px solid var(--line); }

  .btn { padding: 9px 16px; border-radius: 11px; border: 1px solid var(--line); font-size: 14px; font-weight: 600; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .btn[disabled] { opacity: 0.45; cursor: default; }

  #memoText {
    width: 100%; min-height: 46dvh; resize: vertical;
    background: var(--bg-raised); border: 1px solid var(--line); border-radius: 12px;
    padding: 13px; outline: none; line-height: 1.7;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13.5px;
  }
  .hint { font-size: 12.5px; color: var(--text-dim); margin: 0 0 12px; line-height: 1.7; }

  .model-row {
    display: flex; align-items: center; gap: 12px; width: 100%;
    padding: 14px 16px; border-radius: 13px; border: 1px solid var(--line);
    margin-bottom: 8px; text-align: left;
  }
  .model-row.sel { border-color: var(--accent); background: var(--bg-raised); }
  .model-row .name { font-weight: 600; }
  .model-row .sub { font-size: 12.5px; color: var(--text-dim); }
  .model-row .check { margin-left: auto; color: var(--accent); opacity: 0; }
  .model-row.sel .check { opacity: 1; }

  #login { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 24px; background: var(--bg); }
  #login.off { display: none; }
  #loginCard { width: 100%; max-width: 340px; text-align: center; }
  #loginCard .glyph { font-size: 40px; margin-bottom: 14px; }
  #loginCard p { color: var(--text-dim); font-size: 13.5px; margin: 0 0 22px; }
  #pw {
    width: 100%; padding: 13px 16px; border-radius: 13px;
    background: var(--bg-raised); border: 1px solid var(--line); outline: none; text-align: center;
  }
  #pw:focus { border-color: var(--accent); }
  #loginBtn { width: 100%; margin-top: 10px; padding: 13px; }
  #loginErr { color: var(--danger); font-size: 13px; min-height: 20px; margin-top: 12px; }
</style>
</head>
<body>

<!-- 로그인 -->
<div id="login">
  <div id="loginCard">
    <div class="glyph">💬</div>
    <p>비밀번호를 입력하면 로그인 상태가 유지됩니다.</p>
    <form id="loginForm">
      <input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호" enterkeyhint="go">
      <button id="loginBtn" class="btn primary" type="submit">들어가기</button>
    </form>
    <div id="loginErr"></div>
  </div>
</div>

<!-- 본체 -->
<div id="app">
  <header>
    <button id="modelBtn" type="button"><span class="dot"></span><span id="modelLabel">…</span></button>
    <div class="spacer"></div>
    <button id="memoBtn" class="icon-btn" type="button" title="기억 노트" aria-label="기억 노트">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </svg>
    </button>
    <button id="outBtn" class="icon-btn" type="button" title="로그아웃" aria-label="로그아웃">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>
      </svg>
    </button>
  </header>

  <div id="scroller"><div id="thread"></div></div>

  <div id="composer">
    <div id="composerInner">
      <textarea id="input" rows="1" placeholder="메시지" enterkeyhint="enter"></textarea>
      <button id="send" type="button" disabled aria-label="보내기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19V5"/><path d="m5 12 7-7 7 7"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<!-- 기억 노트 -->
<div id="memoSheet" class="sheet">
  <div class="card">
    <div class="card-head">
      <h2>기억 노트</h2><div class="spacer"></div>
      <span id="memoStamp" class="hint" style="margin:0"></span>
    </div>
    <div class="card-body">
      <p class="hint">
        오래된 대화가 접힐 때 AI가 스스로 갱신하는 장기 기억입니다. 직접 고쳐도 되고, 지워도 됩니다.<br>
        여기 적힌 내용은 매 대화마다 시스템 프롬프트로 들어갑니다. (원본 대화는 지워지지 않고 그대로 보관됩니다.)
      </p>
      <textarea id="memoText" spellcheck="false" placeholder="(아직 쌓인 기억이 없습니다)"></textarea>
    </div>
    <div class="card-foot">
      <button class="btn" data-close type="button">닫기</button>
      <button id="memoSave" class="btn primary" type="button">저장</button>
    </div>
  </div>
</div>

<!-- 모델 선택 -->
<div id="modelSheet" class="sheet">
  <div class="card" style="max-width:400px">
    <div class="card-head"><h2>모델</h2></div>
    <div class="card-body" id="modelList"></div>
    <div class="card-foot"><button class="btn" data-close type="button">닫기</button></div>
  </div>
</div>

<script>
(() => {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const el = {
    login: $('login'), loginForm: $('loginForm'), pw: $('pw'), loginBtn: $('loginBtn'), loginErr: $('loginErr'),
    app: $('app'), scroller: $('scroller'), thread: $('thread'),
    input: $('input'), send: $('send'),
    modelBtn: $('modelBtn'), modelLabel: $('modelLabel'), modelSheet: $('modelSheet'), modelList: $('modelList'),
    memoBtn: $('memoBtn'), memoSheet: $('memoSheet'), memoText: $('memoText'),
    memoSave: $('memoSave'), memoStamp: $('memoStamp'), outBtn: $('outBtn'),
  };

  const state = { models: {}, model: null, busy: false, oldestId: null, hasMore: false };
  const MODEL_KEY = 'chat.model';

  // ── 마크다운 (의존성 없이 필요한 만큼만) ───────────────────
  const esc = (s) => s.replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function inline(s) {
    return esc(s)
      .replace(/`([^`\n]+)`/g, (_, c) => `<code>${c}</code>`)
      .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
      .replace(/~~([^~\n]+)~~/g, '<del>$1</del>')
      .replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  }

  function md(src) {
    const out = [];
    const lines = src.split('\n');
    let i = 0, para = [], list = null;

    const flushPara = () => { if (para.length) { out.push(`<p>${inline(para.join('\n')).replace(/\n/g, '<br>')}</p>`); para = []; } };
    const flushList = () => { if (list) { out.push(`<${list.tag}>${list.items.map((t) => `<li>${inline(t)}</li>`).join('')}</${list.tag}>`); list = null; } };
    const flushAll = () => { flushPara(); flushList(); };

    while (i < lines.length) {
      const line = lines[i];

      const fence = line.match(/^```(\w*)\s*$/);
      if (fence) {
        flushAll();
        const buf = [];
        i++;
        while (i < lines.length && !/^```\s*$/.test(lines[i])) buf.push(lines[i++]);
        i++;
        out.push(`<pre><code>${esc(buf.join('\n'))}</code></pre>`);
        continue;
      }

      if (!line.trim()) { flushAll(); i++; continue; }

      const head = line.match(/^(#{1,6})\s+(.*)$/);
      if (head) { flushAll(); out.push(`<h3>${inline(head[2])}</h3>`); i++; continue; }

      if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { flushAll(); out.push('<hr>'); i++; continue; }

      const quote = line.match(/^>\s?(.*)$/);
      if (quote) {
        flushAll();
        const buf = [quote[1]];
        i++;
        while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ''));
        out.push(`<blockquote>${inline(buf.join('\n')).replace(/\n/g, '<br>')}</blockquote>`);
        continue;
      }

      const item = line.match(/^\s*(?:([-*+])|(\d+)[.)])\s+(.*)$/);
      if (item) {
        flushPara();
        const tag = item[1] ? 'ul' : 'ol';
        if (!list || list.tag !== tag) { flushList(); list = { tag, items: [] }; }
        list.items.push(item[3]);
        i++;
        continue;
      }

      flushList();
      para.push(line);
      i++;
    }
    flushAll();
    return out.join('');
  }

  // ── 스크롤 ─────────────────────────────────────────────
  const nearBottom = () => {
    const s = el.scroller;
    return s.scrollHeight - s.scrollTop - s.clientHeight < 120;
  };
  const toBottom = (smooth) => {
    el.scroller.scrollTo({ top: el.scroller.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
  };

  // ── 렌더 ───────────────────────────────────────────────
  function addMsg(role, text, { prepend = false } = {}) {
    const wrap = document.createElement('div');
    wrap.className = `msg ${role}`;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (role === 'user') bubble.textContent = text;
    else bubble.innerHTML = md(text);
    wrap.appendChild(bubble);
    if (prepend) el.thread.prepend(wrap); else el.thread.appendChild(wrap);
    return bubble;
  }

  function addNotice(text, isError) {
    const n = document.createElement('div');
    n.className = `notice${isError ? ' err' : ''}`;
    n.textContent = text;
    el.thread.appendChild(n);
    return n;
  }

  function renderEmpty() {
    if (el.thread.children.length) return;
    const d = document.createElement('div');
    d.id = 'empty';
    d.textContent = '아무 말이나 시작해도 됩니다.';
    el.thread.appendChild(d);
  }

  // ── API ────────────────────────────────────────────────
  async function api(path, opts = {}) {
    const res = await fetch(path, {
      credentials: 'same-origin',
      headers: opts.body ? { 'content-type': 'application/json' } : undefined,
      ...opts,
    });
    if (res.status === 401) { showLogin(); throw new Error('unauthorized'); }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    return data;
  }

  // ── 부팅 ───────────────────────────────────────────────
  function applyModels(models, defaultModel) {
    state.models = models || {};
    const saved = localStorage.getItem(MODEL_KEY);
    state.model = state.models[saved] ? saved : defaultModel;
    el.modelLabel.textContent = state.models[state.model]?.label ?? state.model;
    el.modelList.innerHTML = '';
    for (const [id, meta] of Object.entries(state.models)) {
      const row = document.createElement('button');
      row.type = 'button';
      row.className = `model-row${id === state.model ? ' sel' : ''}`;
      row.innerHTML =
        `<div><div class="name">${esc(meta.label)}</div><div class="sub">${esc(id)}</div></div>` +
        `<div class="check">✓</div>`;
      row.onclick = () => {
        state.model = id;
        localStorage.setItem(MODEL_KEY, id);
        el.modelLabel.textContent = meta.label;
        [...el.modelList.children].forEach((c) => c.classList.remove('sel'));
        row.classList.add('sel');
        closeSheets();
      };
      el.modelList.appendChild(row);
    }
  }

  function showLogin() {
    el.app.classList.remove('on');
    el.login.classList.remove('off');
    setTimeout(() => el.pw.focus(), 50);
  }

  async function enterApp(data) {
    el.login.classList.add('off');
    el.app.classList.add('on');
    applyModels(data.models, data.defaultModel);
    await loadHistory();
  }

  async function loadHistory() {
    const data = await api('/api/history');
    el.thread.innerHTML = '';
    state.hasMore = data.hasMore;
    state.oldestId = data.messages[0]?.id ?? null;
    if (state.hasMore) addLoadMore();
    for (const m of data.messages) addMsg(m.role, m.content);
    applyMemory(data.memory);
    renderEmpty();
    requestAnimationFrame(() => toBottom(false));
  }

  function addLoadMore() {
    const b = document.createElement('button');
    b.id = 'loadMore';
    b.type = 'button';
    b.textContent = '이전 대화 더 보기';
    b.onclick = async () => {
      b.disabled = true;
      b.textContent = '불러오는 중…';
      try {
        const data = await api(`/api/history?before=${state.oldestId}`);
        const anchorHeight = el.scroller.scrollHeight;
        // 오래된 것부터 화면 위쪽에 오도록, 최신 → 과거 순으로 하나씩 맨 앞에 붙인다.
        for (const m of [...data.messages].reverse()) addMsg(m.role, m.content, { prepend: true });
        el.thread.prepend(b);  // 버튼은 다시 맨 위로
        state.oldestId = data.messages[0]?.id ?? state.oldestId;
        state.hasMore = data.hasMore;
        if (!state.hasMore) b.remove();
        else { b.disabled = false; b.textContent = '이전 대화 더 보기'; }
        el.scroller.scrollTop += el.scroller.scrollHeight - anchorHeight;
      } catch (e) {
        b.disabled = false;
        b.textContent = '이전 대화 더 보기';
      }
    };
    el.thread.appendChild(b);
  }

  function applyMemory(memory) {
    el.memoText.value = memory?.notes ?? '';
    el.memoStamp.textContent = memory?.updated_at
      ? `${new Date(memory.updated_at).toLocaleString('ko-KR')} 갱신`
      : '';
  }

  // ── 전송 ───────────────────────────────────────────────
  function syncSendBtn() {
    el.send.disabled = state.busy || !el.input.value.trim();
  }

  function autoGrow() {
    el.input.style.height = 'auto';
    el.input.style.height = `${el.input.scrollHeight}px`;
  }

  async function send() {
    const content = el.input.value.trim();
    if (!content || state.busy) return;

    state.busy = true;
    el.input.value = '';
    autoGrow();
    syncSendBtn();

    document.getElementById('empty')?.remove();
    addMsg('user', content);
    const bubble = addMsg('assistant', '');
    bubble.innerHTML = '<span class="cursor"></span>';
    toBottom(true);

    let text = '';
    let failed = false;

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ content, model: state.model }),
      });
      if (res.status === 401) { showLogin(); return; }
      if (!res.ok || !res.body) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.error || `HTTP ${res.status}`);
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';

      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });

        let sep;
        while ((sep = buf.indexOf('\n\n')) >= 0) {
          const frame = buf.slice(0, sep);
          buf = buf.slice(sep + 2);
          if (!frame.startsWith('data: ')) continue;

          let ev;
          try { ev = JSON.parse(frame.slice(6)); } catch { continue; }

          if (ev.type === 'delta') {
            const stick = nearBottom();
            text += ev.text;
            bubble.innerHTML = md(text) + '<span class="cursor"></span>';
            if (stick) toBottom(false);
          } else if (ev.type === 'error') {
            failed = true;
            bubble.innerHTML = md(text);
            if (!text) bubble.parentElement.remove();
            addNotice(ev.message, true);
          }
        }
      }
    } catch (err) {
      failed = true;
      bubble.innerHTML = md(text);
      if (!text) bubble.parentElement.remove();
      addNotice(err.message || '전송에 실패했습니다.', true);
    } finally {
      if (!failed) bubble.innerHTML = md(text) || '<em style="opacity:.6">(빈 응답)</em>';
      state.busy = false;
      syncSendBtn();
      if (nearBottom()) toBottom(true);
    }
  }

  // ── 시트 ───────────────────────────────────────────────
  const closeSheets = () => document.querySelectorAll('.sheet.on').forEach((s) => s.classList.remove('on'));
  document.querySelectorAll('.sheet').forEach((sheet) => {
    sheet.addEventListener('click', (e) => { if (e.target === sheet) closeSheets(); });
  });
  document.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', closeSheets));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheets(); });

  el.modelBtn.onclick = () => el.modelSheet.classList.add('on');

  el.memoBtn.onclick = async () => {
    el.memoSheet.classList.add('on');
    try { applyMemory(await api('/api/memory')); } catch {}
  };

  el.memoSave.onclick = async () => {
    el.memoSave.disabled = true;
    const original = el.memoSave.textContent;
    try {
      const r = await api('/api/memory', { method: 'PUT', body: JSON.stringify({ notes: el.memoText.value }) });
      applyMemory({ notes: el.memoText.value, updated_at: r.updated_at });
      el.memoSave.textContent = '저장됨';
      setTimeout(() => { el.memoSave.textContent = original; el.memoSave.disabled = false; }, 900);
    } catch (e) {
      el.memoSave.textContent = '실패';
      setTimeout(() => { el.memoSave.textContent = original; el.memoSave.disabled = false; }, 1400);
    }
  };

  el.outBtn.onclick = async () => {
    if (!confirm('로그아웃할까요?')) return;
    try { await api('/api/logout', { method: 'POST' }); } catch {}
    location.reload();
  };

  // ── 입력 ───────────────────────────────────────────────
  el.input.addEventListener('input', () => { autoGrow(); syncSendBtn(); });
  el.input.addEventListener('keydown', (e) => {
    // 데스크톱: Enter 전송 / Shift+Enter 줄바꿈. 폰에서는 Enter가 줄바꿈이라 그대로 둔다.
    const isPhone = window.matchMedia('(pointer: coarse)').matches;
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !isPhone) {
      e.preventDefault();
      send();
    }
  });
  el.send.onclick = send;

  // 모바일 키보드가 올라올 때 입력창이 가리지 않도록
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', () => { if (nearBottom()) toBottom(false); });
  }

  // ── 로그인 ─────────────────────────────────────────────
  el.loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    el.loginErr.textContent = '';
    el.loginBtn.disabled = true;
    try {
      const data = await api('/api/login', { method: 'POST', body: JSON.stringify({ password: el.pw.value }) });
      el.pw.value = '';
      await enterApp(data);
    } catch (err) {
      el.loginErr.textContent = err.message === 'unauthorized' ? '비밀번호가 틀렸습니다.' : err.message;
    } finally {
      el.loginBtn.disabled = false;
    }
  });

  // 쿠키가 살아 있으면 로그인 화면을 건너뛴다.
  (async () => {
    try {
      const res = await fetch('/api/session', { credentials: 'same-origin' });
      if (!res.ok) throw new Error();
      await enterApp(await res.json());
    } catch {
      showLogin();
    }
  })();
})();
</script>
</body>
</html>
